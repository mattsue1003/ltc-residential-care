<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'self'; form-action 'none'; base-uri 'none'">
<title>長照照護紀錄系統</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23028090'/%3E%3Cpath d='M9 17l5 5 9-11' stroke='white' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>:root{
  --bg:#F4F7F7; --panel:#FFFFFF; --ink:#12343B; --muted:#5B7076; --line:#DCE5E6; --soft:#EEF4F4;
  --pri:#028090; --pri-d:#016570; --pri-soft:#E3F2F3; --acc:#E8552D; --amber:#F4A93C;
  --bad:#C0392B; --bad-soft:#FBEAE8; --warn:#B7791F; --warn-soft:#FDF3E1; --ok:#2E7D5B; --ok-soft:#E5F4EC; --info:#4A6A80; --info-soft:#EAF0F5;
  --r:10px; --sh:0 1px 2px rgba(18,52,59,.06),0 2px 8px rgba(18,52,59,.05);
  font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root[data-theme="auto"]{
  --bg:#0F1A1C; --panel:#162427; --ink:#E4EEEF; --muted:#9AB0B4; --line:#2A3C40; --soft:#1C2D30;
  --pri:#2BB0BF; --pri-d:#5CC9D5; --pri-soft:#173A3F; --bad:#F08070; --bad-soft:#3A1F1C; --warn:#F2B860; --warn-soft:#3A2E17; --ok:#6FCF97; --ok-soft:#183126; --info:#9CB7CC; --info-soft:#1C2A35;
}}
:root[data-theme="dark"]{
  --bg:#0F1A1C; --panel:#162427; --ink:#E4EEEF; --muted:#9AB0B4; --line:#2A3C40; --soft:#1C2D30;
  --pri:#2BB0BF; --pri-d:#5CC9D5; --pri-soft:#173A3F; --bad:#F08070; --bad-soft:#3A1F1C; --warn:#F2B860; --warn-soft:#3A2E17; --ok:#6FCF97; --ok-soft:#183126; --info:#9CB7CC; --info-soft:#1C2A35;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri)}
#app{display:grid;grid-template-columns:220px 1fr;grid-template-rows:56px 1fr;min-height:100vh}
header.top{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;white-space:nowrap}
.brand .logo{width:30px;height:30px;border-radius:8px;background:var(--pri);color:#fff;display:grid;place-items:center;font-size:15px}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:11px;line-height:1}
.search{flex:1;max-width:360px;position:relative;margin-left:auto}
.search input{width:100%;padding:7px 12px;border:1px solid var(--line);border-radius:20px;background:var(--soft)}
.search .drop{position:absolute;top:110%;left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);max-height:320px;overflow:auto;display:none}
.search .drop a{display:block;padding:8px 12px;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
.search .drop a:hover{background:var(--pri-soft)}
.userchip{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:20px;background:var(--pri-soft);color:var(--pri-d);border:0;cursor:pointer;white-space:nowrap;font-size:13px}
nav.side{background:var(--panel);border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto}
nav.side a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--ink);text-decoration:none;margin-bottom:2px;font-size:14.5px}
nav.side a:hover{background:var(--soft)}
nav.side a.on{background:var(--pri);color:#fff}
nav.side a .ic{width:20px;text-align:center}
nav.side .badge{margin-left:auto;background:var(--bad);color:#fff;border-radius:10px;padding:0 7px;font-size:12px}
nav.side a.on .badge{background:#fff;color:var(--bad)}
nav.side .sec{font-size:11.5px;color:var(--muted);padding:12px 12px 4px;letter-spacing:.05em}
main{padding:20px 24px 60px;min-width:0}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:17px;margin:22px 0 10px}
h3{font-size:15px;margin:14px 0 8px}
.sub{color:var(--muted);font-size:13.5px;margin:0 0 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh);margin-bottom:16px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh);cursor:default}
 button.kpi{text-align:left;cursor:pointer;width:100%;font:inherit;color:inherit}button.kpi:hover{border-color:var(--pri)}
.qcell{border:0;background:transparent;padding:2px 4px;margin:-2px -4px;border-radius:6px;cursor:pointer;text-align:left;font:inherit;color:var(--pri-d);text-decoration:underline;text-underline-offset:3px}.qcell:hover{background:var(--pri-soft)}
.kpi .n{font-size:28px;font-weight:700;line-height:1.1}
.kpi .l{color:var(--muted);font-size:13px}
.kpi.bad .n{color:var(--bad)}.kpi.warn .n{color:var(--warn)}.kpi.ok .n{color:var(--ok)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 14px;border-radius:8px;cursor:pointer;white-space:nowrap;font-size:14px}
.btn:hover{border-color:var(--pri);color:var(--pri)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri-d)}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:12px;font-size:12.5px;background:var(--soft);color:var(--muted);white-space:nowrap;border:1px solid transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.info{background:var(--info-soft);color:var(--info)}.chip.pri{background:var(--pri-soft);color:var(--pri-d)}
.chip.ref{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;background:transparent;border-color:var(--line)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button.chip{cursor:pointer}
.chips button.chip.on{background:var(--pri);color:#fff}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;padding:8px;border-bottom:2px solid var(--line);white-space:nowrap;background:var(--panel);position:sticky;top:0}
table.t td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--soft)}
.tw{overflow:auto;max-width:100%}
.rem{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.rem:last-child{border-bottom:0}
.rem .dot{width:9px;height:9px;border-radius:50%;flex:none}
.rem .dot.bad{background:var(--bad)}.rem .dot.warn{background:var(--amber)}.rem .dot.info{background:var(--info)}
.rem .who{font-weight:600;min-width:96px}
.rem .what{flex:1;min-width:0}
.rem .due{font-size:12.5px;color:var(--muted);white-space:nowrap}
.rem .due.bad{color:var(--bad);font-weight:600}
.empty{color:var(--muted);text-align:center;padding:28px 10px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:12px 0 16px;overflow:auto}
.tabs a{padding:8px 14px;text-decoration:none;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs a.on{color:var(--pri);border-color:var(--pri);font-weight:600}
.scorecard{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--panel)}
.scorecard .s{font-size:24px;font-weight:700}
.scorecard .lv{font-size:13px}
.scorecard .meta{font-size:12px;color:var(--muted)}
.scorecard.bad{border-left:4px solid var(--bad)}.scorecard.warn{border-left:4px solid var(--amber)}.scorecard.ok{border-left:4px solid var(--ok)}.scorecard.none{border-left:4px dashed var(--line)}
label.f{display:block;font-size:13px;color:var(--muted);margin-bottom:10px}
label.f > input,label.f > select,label.f > textarea{display:block;width:100%;margin-top:4px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font-size:14.5px}
label.f > textarea{min-height:70px;resize:vertical}
label.f.req > span::after{content:" *";color:var(--bad)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);outline-offset:0;border-color:var(--pri)}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px;margin:4px 0 10px}
.checks label{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--ink);cursor:pointer}
.q{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:8px;background:var(--panel)}
.q .qt{font-weight:600;margin-bottom:6px;font-size:14.5px}
.q .opts{display:flex;flex-wrap:wrap;gap:6px}
.q .opts label{display:flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:14px}
.q .opts input{accent-color:var(--pri)}
.q .opts label:has(input:checked){background:var(--pri-soft);border-color:var(--pri);color:var(--pri-d)}
.q.miss{border-color:var(--amber)}
.scorebar{position:sticky;bottom:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 -4px 16px rgba(0,0,0,.06);margin-top:12px;z-index:5;flex-wrap:wrap}
.scorebar .big{font-size:26px;font-weight:700}
.narr{background:var(--soft);border-radius:8px;padding:10px 12px;font-size:14px;white-space:pre-wrap}
.sugg{border:1px dashed var(--pri);border-radius:var(--r);padding:10px 12px;margin-bottom:8px;background:var(--pri-soft)}
.sugg b{color:var(--pri-d)}
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.cell{display:inline-block;min-width:62px;padding:3px 6px;border-radius:6px;font-size:12px;cursor:pointer;border:0}
.cell.ok{background:var(--ok-soft);color:var(--ok)}.cell.warn{background:var(--warn-soft);color:var(--warn)}.cell.bad{background:var(--bad-soft);color:var(--bad);font-weight:600}.cell.na{background:transparent;color:var(--muted)}
.grid-in input{width:100%;min-width:46px;padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel);text-align:center}
.grid-in input.flag{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);font-weight:600}
.grid-in input[type=checkbox]{width:18px;height:18px;accent-color:var(--pri)}
.grid-in td{padding:4px}
.grid-in tr.saved td:first-child{box-shadow:inset 3px 0 0 var(--ok)}
.acc-item{border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;background:var(--panel)}
.acc-item summary{display:flex;gap:10px;align-items:center;padding:10px 12px;cursor:pointer;list-style:none}
.acc-item summary::-webkit-details-marker{display:none}
.acc-item .body{padding:0 12px 12px;font-size:14px}
.code{font-family:ui-monospace,Menlo,monospace;font-weight:700;color:var(--pri-d);min-width:34px}
.rating{display:flex;gap:4px}
.rating button{width:30px;height:28px;border:1px solid var(--line);background:var(--panel);border-radius:6px;cursor:pointer;font-weight:700}
.rating button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.bar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri)}
#modal{position:fixed;inset:0;background:rgba(10,25,28,.45);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:40px 16px;overflow:auto}
#modal.on{display:flex}
#modal .box{background:var(--panel);border-radius:14px;max-width:760px;width:100%;padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
#modal .box h2{margin-top:0}
#modal .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:60;align-items:center}
#toast div{background:var(--ink);color:var(--panel);padding:9px 16px;border-radius:20px;font-size:14px;box-shadow:var(--sh);animation:tin .2s}
#toast div.bad{background:var(--bad);color:#fff}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.banner{padding:10px 14px;border-radius:var(--r);margin-bottom:14px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.warn{background:var(--warn-soft);color:var(--warn)}.banner.info{background:var(--info-soft);color:var(--info)}.banner.bad{background:var(--bad-soft);color:var(--bad)}
.lock{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:100;padding:16px}
.lock .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px;max-width:400px;width:100%;box-shadow:var(--sh)}
.spark{display:block}
.muted{color:var(--muted)}.small{font-size:12.5px}
.right{text-align:right}
.nowrap{white-space:nowrap}
.hd{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.pill-badges{display:flex;gap:4px;flex-wrap:wrap}
#printArea{display:none}
.bedside{max-width:640px}
.bs-head{display:flex;gap:6px;align-items:center}.bs-head select{flex:1;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font-size:17px;font-weight:600}
.bs-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.bs-num{display:flex;flex-direction:column;font-size:12.5px;color:var(--muted)}.bs-num input{font-size:20px;padding:10px 8px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);text-align:center;width:100%}
.bs-num.flag input{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);font-weight:700}
.bs-sec{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
.bs-pain{display:grid;grid-template-columns:repeat(11,1fr);gap:4px;margin-top:6px}.bs-pain button{padding:10px 0;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-weight:700;cursor:pointer}.bs-pain button.hi{color:var(--warn)}.bs-pain button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.bs-big{font-size:26px;font-weight:700;min-width:44px;text-align:center}
.bs-togs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}.bs-tog{padding:14px 6px;border:1px solid var(--line);border-radius:12px;background:var(--panel);font-size:16px;cursor:pointer}.bs-tog.on{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:700}
.bs-slots{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:8px}.bs-slot{padding:6px 2px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-size:13px;cursor:pointer;line-height:1.2}.bs-slot small{display:block;color:var(--muted);font-size:11px}
.bs-slot.on{background:var(--pri-soft);border-color:var(--pri);color:var(--pri-d);font-weight:600}.bs-slot.now{outline:2px solid var(--acc)}.bs-slot.future{opacity:.55}
.bs-next{padding:12px 22px;font-size:16px}
.tpl-bar{display:flex;gap:8px;align-items:flex-end;margin-bottom:10px;padding:10px;background:var(--pri-soft);border-radius:10px}.tpl-bar label{flex:1}
.q.cur{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri-soft)}
@media (max-width:860px){.bs-grid{grid-template-columns:repeat(3,1fr)}}
.photos{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.photos .ph{width:84px;height:84px;border:1px solid var(--line);border-radius:8px;overflow:hidden;padding:0;background:var(--soft);cursor:pointer;display:grid;place-items:center;font-size:13px;color:var(--pri-d)}
.photos .ph img{width:100%;height:100%;object-fit:cover}
.photos .ph.add{border-style:dashed;border-color:var(--pri)}
footer.cr{color:var(--muted);font-size:12px;margin-top:30px;text-align:center}
.mnav{display:none}
@media (max-width:860px){
  #app{grid-template-columns:1fr;grid-template-rows:56px auto 1fr}
  nav.side{position:static;height:auto;display:flex;overflow-x:auto;padding:6px 8px;border-right:0;border-bottom:1px solid var(--line);gap:2px}
  nav.side a{flex:none;padding:7px 10px;font-size:13.5px}
  nav.side .sec{display:none}
  main{padding:16px 16px 60px}
  .g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2{grid-template-columns:1fr}
  .brand small{display:none}
  .search{max-width:none}
  .rem{flex-wrap:wrap}
  .rem .who{min-width:0}
}
@media print{
  body.printing #app,body.printing #modal,body.printing #toast{display:none!important}
  body.printing #printArea{display:block}
  body.printing{background:#fff;color:#000}
}
/* 列印版面 */
#printArea{font-family:"BiauKai","DFKai-SB","標楷體","PingFang TC",serif;color:#000;background:#fff}
.pg{page-break-after:always;padding:0;font-size:12pt}
.pg:last-child{page-break-after:auto}
.pg h1{text-align:center;font-size:17pt;margin:0 0 2pt}
.pg .org{text-align:center;font-size:12pt;margin-bottom:6pt}
.pg table{width:100%;border-collapse:collapse;margin:4pt 0}
.pg td,.pg th{border:1px solid #000;padding:3pt 5pt;vertical-align:top;font-size:11pt}
.pg th{background:#eee;font-weight:700;text-align:center}
.pg .meta{display:flex;justify-content:space-between;font-size:11pt;margin:4pt 0}
.pg .sign{display:flex;justify-content:space-between;margin-top:18pt;font-size:11.5pt}
.pg .box{border:1px solid #000;min-height:50pt;padding:4pt}
.pg .lines{border-bottom:1px solid #000;height:20pt}
.pg .note{font-size:9.5pt;color:#333}
.pg .ck::before{content:"☐ "}.pg .ck.y::before{content:"☑ "}
@page{size:A4;margin:14mm 12mm}
@page land{size:A4 landscape;margin:10mm 12mm}
.pg.land{page:land}
</style></head>
<body>
<div id="app">
  <header class="top"><div class="brand"><div class="logo">✓</div><div><span id="orgName">長照住宿機構照護系統</span><small>評估・紀錄・提醒・評鑑</small></div></div>
    <div class="search"><input id="q" placeholder="搜尋住民姓名、床號、功能（按 / ）" aria-label="搜尋"><div class="drop" id="qdrop"></div></div>
    <button class="userchip" id="userChip" data-act="switchUser">設定使用者</button></header>
  <nav class="side" aria-label="主選單"></nav>
  <main></main>
</div>
<div id="modal"></div><div id="toast" role="status" aria-live="polite"></div><div id="printArea"></div>
<script>/* ---- scales.js ---- */
/* 評估量表定義：自動計分、判讀、敘述句、照顧計畫建議 */
const SCALES = {
  barthel: {
    name: '巴氏量表 (ADL)', short: 'ADL', domain: '身體', cycle: 90, core: true,
    items: [
      ['進食', [[10,'自己在合理時間內進食，可自行取食'],[5,'需部分協助（切食物、攪拌）'],[0,'無法自行進食或需餵食']]],

const CORE_SCALES = Object.keys(SCALES).filter(k => SCALES[k].core);

function scoreScale(type, answers, extra) {
  const sc = SCALES[type];
  if (sc.form) return { score: null, level: sc.level(extra || {}) };
  let raw = 0;
  sc.items.forEach((it, i) => { const v = answers[i]; if (v !== undefined && v !== null && v !== '') raw += +v; });
  const score = sc.adjust ? sc.adjust(raw, extra) : raw;
  return { score, level: sc.level(score) };
}
function answeredAll(type, answers) {
  const sc = SCALES[type];
  if (sc.form) return true;
  return sc.items.every((_, i) => answers[i] !== undefined && answers[i] !== null && answers[i] !== '');
}

/* 自動敘述句：給護理/專業紀錄直接複製 */
function narrative(type, a, r) {
  const sc = SCALES[type];
  const who = r ? r.name : '個案';
  if (sc.form) {
    const e = a.extra || {};
    return `${who}社會心理評估：入住適應「${e.adapt || '未填'}」，情緒「${e.mood || '未填'}」，家庭支持「${e.family || '未填'}」，經濟「${e.econ || '未填'}」。` +
      (e.faith ? `宗教文化需求：${e.faith}。` : '') + (e.hobby ? `興趣習慣：${e.hobby}。` : '') + (e.wish ? `本人期待：${e.wish}。` : '') +
      `預立醫療：${e.acp || '未討論'}。評估結果：${a.level}。`;
  }
  const low = [];
  if (!sc.errorBased && sc.items) sc.items.forEach((it, i) => {
    const opts = it[1]; const v = a.answers[i]; if (v === undefined) return;
    const best = sc.lowIsBad ? Math.max(...opts.map(o => o[0])) : (type === 'barthel' || type === 'mna' ? Math.max(...opts.map(o => o[0])) : Math.min(...opts.map(o => o[0])));
    if (+v !== best) { const o = opts.find(o => o[0] === +v); low.push(`${it[0]}（${o ? o[1] : v}）`); }
  });
  let s = `${who}於 ${a.date} 進行${sc.name}，`;
  if (sc.errorBased) s += `答錯 ${a.score} 題（已依教育程度校正），判讀為「${a.level}」。`;
  else s += `總分 ${a.score}/${sc.max} 分，判讀為「${a.level}」。`;
  if (low.length && type !== 'gds') s += `${type === 'barthel' || type === 'mna' || type === 'braden' ? '需協助或待改善項目' : '風險項目'}：${low.join('、')}。`;
  if (type === 'pain' && a.extra) { const e = a.extra; s += [e.site && `位置：${e.site}`, e.onset && `開始：${e.onset}`, e.dur && `持續：${e.dur}`, e.worse && `加重：${e.worse}`, e.relief && `緩解：${e.relief}`].filter(Boolean).join('；') + (e.site ? '。' : ''); }
  if (type === 'mna' && a.extra && a.extra.height && a.extra.weight) { const bmi = a.extra.weight / Math.pow(a.extra.height / 100, 2); s += `BMI ${bmi.toFixed(1)}。`; }
  return s;
}

/* 依評估結果建議照顧問題與措施（可一鍵加入照顧計畫） */
function suggestProblems(r, latest) {
  const out = [];
  const add = (key, disc, problem, goal, interventions, ref) => out.push({ key, disc, problem, goal, interventions, ref });
  const b = latest.barthel, m = latest.morse, br = latest.braden, n = latest.mna, g = latest.gds, sp = latest.spmsq, p = latest.pain, so = latest.social;

    '依可執行部分給予最少必要協助、鼓勵自行進食與盥洗；職能治療評估輔具（易握湯匙、高邊盤、穿衣輔具）；每日下床至少 2 次', 'B24 B27');
  if (b && b.answers && (+b.answers[9] < 10 || +b.answers[8] < 10)) add('toilet', '照服／護理', '有失禁之虞', '減少失禁次數、維持會陰部皮膚完整',
    '訂定每 2 小時定時如廁計畫並記錄；觀察失禁型態；可控制者執行自行如廁訓練（含給水計畫）', 'B26');
  if (m && m.score >= 45) add('fall', '護理／物理／照服', `高跌倒風險（Morse ${m.score} 分）`, '照顧期間無跌倒事件',
    '床降至最低並固定煞車、呼叫鈴放在可及處、夜燈；穿防滑鞋；定時如廁；物理治療平衡與下肢肌力訓練；藥物檢視（鎮靜安眠、降壓藥）', 'B12');
  else if (m && m.score >= 25) add('fall', '護理／照服', `中跌倒風險（Morse ${m.score} 分）`, '照顧期間無跌倒事件', '環境安全檢查、防滑鞋、提醒使用輔具、夜間定時巡視', 'B12');
  if (br && br.score <= 18) add('pi', '護理／照服／營養', `壓力性損傷風險（Braden ${br.score} 分，${br.level}）`, '皮膚完整、無新發壓力性損傷',
    '至少每 2 小時翻身擺位並記錄；使用減壓氣墊床與枕頭支撐骨突處；每日皮膚檢視；失禁後立即清潔與保護；營養師評估蛋白質與熱量', 'B13 B25');
  if (n && n.score <= 11) add('nut', '營養／護理', `營養${n.score <= 7 ? '不良' : '不良風險'}（MNA-SF ${n.score} 分）`, '1 個月內體重不再下降，3 個月內回升至目標體重',
    '營養師評估並調整個別化飲食與質地；記錄進食量；每週量體重；必要時補充營養品；口腔與吞嚥評估', 'B18 B28');
  if (g && g.score >= 5) add('mood', '社工／護理', `憂鬱傾向（GDS ${g.score} 分）`, '情緒穩定，主動參與團體活動每週至少 1 次',
    '社工定期關懷會談；安排有興趣的團體活動；增加家屬互動；症狀持續或有自傷意念時轉介精神科', 'B3 B5');
  if (sp && sp.score >= 3) add('cog', '職能／照服', `認知功能障礙（SPMSQ 錯 ${sp.score} 題）`, '維持定向感與參與度',
    '現實導向（日曆、時鐘、名牌）；規律的感官刺激與認知功能訓練並記錄；簡化指令、一次一步驟', 'B24');
  if (p && p.score >= 4) add('pain', '護理', `疼痛（${p.extra && p.extra.nrs !== undefined && p.extra.nrs !== '' ? 'NRS' : 'PAINAD'} ${p.score} 分）`, '疼痛分數降至 3 分以下',
    '依醫囑給予止痛處置並於 30–60 分鐘後評值；非藥物措施（擺位、熱敷、按摩、轉移注意力）；疼痛持續時通知醫師', 'B14');
  if (r && r.tubes && r.tubes.ng) add('ng', '護理／語言／營養', '留置鼻胃管', '管灌安全、評估移除可能',
    '個別灌食空針；每日至少一次天然食材；灌食前確認管路位置與回抽、床頭抬高 30–45 度並維持 1 小時；吞嚥評估與進食訓練以利移除鼻胃管', 'B29 B19');
  if (r && r.tubes && r.tubes.foley) add('foley', '護理', '留置導尿管', '預防泌尿道感染、評估移除可能',
    '會陰部清潔；尿袋低於膀胱；記錄尿量與性狀；評估膀胱訓練與移除時機', 'B19 B16');
  if (so && so.level && so.level.includes('社工')) add('social', '社工', `社會心理需求（${so.level}）`, '適應機構生活、維持家庭支持',
    '入住適應輔導；家屬聯繫每季至少 1 次；無家屬者依長照法第 46 條通報地方主管機關', 'B3 B7 D10');
  return out;
}

/* ---- store.js ---- */
/* 本機資料庫：IndexedDB（失敗時退回 localStorage），可選擇以密碼 AES-GCM 加密 */
const COLLECTIONS = ['residents','assessments','daily','weights','events','restraints','plans','contacts','meetings','vaccines','notes','photos','audit','quarterly','accred','settings'];
const DB = {};
COLLECTIONS.forEach(c => DB[c] = c === 'settings' || c === 'quarterly' || c === 'accred' ? {} : []);

const Store = {
  idb: null, key: null, salt: null, dirty: new Set(), timer: null,
  async open() {
    try {
      this.idb = await new Promise((res, rej) => {
        const rq = indexedDB.open('ltc-facility', 1);
        rq.onupgradeneeded = () => rq.result.createObjectStore('kv');
        rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error);
      });
    } catch (e) { this.idb = null; }
  },
  async rawGet(k) {
    if (!this.idb) { try { return localStorage.getItem('ltc:' + k); } catch (e) { return null; } }
    return new Promise(res => { const t = this.idb.transaction('kv').objectStore('kv').get(k); t.onsuccess = () => res(t.result ?? null); t.onerror = () => res(null); });
  },
  async rawSet(k, v) {
    if (!this.idb) { try { localStorage.setItem('ltc:' + k, v); } catch (e) { toast('儲存空間不足，請先匯出備份', 'bad'); } return; }
    return new Promise(res => { const tx = this.idb.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = res; tx.onerror = res; });
  },
  async rawClear() {
    if (!this.idb) { Object.keys(localStorage).filter(k => k.startsWith('ltc:')).forEach(k => localStorage.removeItem(k)); return; }
    return new Promise(res => { const tx = this.idb.transaction('kv', 'readwrite'); tx.objectStore('kv').clear(); tx.oncomplete = res; });
  },
  async meta() { const m = await this.rawGet('__meta'); return m ? JSON.parse(m) : null; },
  async deriveKey(pass, salt) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 200000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  },
  async enc(str) {
    if (!this.key) return str;
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, this.key, new TextEncoder().encode(str)));
    return 'ENC:' + b64(iv) + ':' + b64(ct);
  },
  async dec(str) {
    if (!str || !str.startsWith('ENC:')) return str;
    const [, iv, ct] = str.split(':');
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(iv) }, this.key, unb64(ct));
    return new TextDecoder().decode(pt);
  },
  async unlock(pass) {
    const m = await this.meta();
    this.salt = unb64(m.salt); this.key = await this.deriveKey(pass, this.salt);
    try { const chk = await this.dec(m.check); if (chk !== 'ok') throw 0; } catch (e) { this.key = null; return false; }
    return true;
  },
  async loadAll() {
    for (const c of COLLECTIONS) {
      const v = await this.rawGet(c);
      if (v) { try { DB[c] = JSON.parse(await this.dec(v)); } catch (e) { console.error('load', c, e); } }
    }
  },
  mark(c) { this.dirty.add(c); clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 300); },
  async flush() {
    const list = [...this.dirty]; this.dirty.clear();
    for (const c of list) await this.rawSet(c, await this.enc(JSON.stringify(DB[c])));
    if (typeof Cloud !== 'undefined' && Cloud.on) { await this.rawSet('__meta', JSON.stringify({ cloud: true, saved: new Date().toISOString() })); Cloud.afterFlush(list); return; }
    const m = (await this.meta()) || {}; m.saved = new Date().toISOString(); m.enc = !!this.key;
    if (this.key && !m.check) { m.salt = b64(this.salt); m.check = await this.enc('ok'); }
    await this.rawSet('__meta', JSON.stringify(m));
    if (typeof Folder !== 'undefined') Folder.schedule();
  },
  async setPassword(pass) {
    // 先用舊金鑰解開所有照片，換金鑰後重新加密
    const ph = {}; for (const p of (DB.photos || [])) { const v = await this.rawGet('ph:' + p.id); if (v) { try { ph[p.id] = await this.dec(v); } catch (e) {} } }
    if (!pass) { this.key = null; await this.rawSet('__meta', JSON.stringify({ enc: false })); }
    else { this.salt = crypto.getRandomValues(new Uint8Array(16)); this.key = await this.deriveKey(pass, this.salt);
      await this.rawSet('__meta', JSON.stringify({ enc: true, salt: b64(this.salt), check: await this.enc('ok') })); }
    for (const id in ph) await this.rawSet('ph:' + id, await this.enc(ph[id]));
    COLLECTIONS.forEach(c => this.dirty.add(c)); await this.flush();
  },
};
function b64(u8) { let s = ''; u8.forEach(b => s += String.fromCharCode(b)); return btoa(s); }
function unb64(s) { return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }

/* 通用 CRUD */
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function save(coll, obj) {
  const arr = DB[coll];
  if (!obj.id) { obj.id = uid(); obj.created = nowISO(); obj.by = obj.by || currentUser(); arr.push(obj); }
  else { const i = arr.findIndex(x => x.id === obj.id); delete obj._new; if (i >= 0) { obj.updated = nowISO(); arr[i] = obj; } else { obj.created = nowISO(); obj.by = obj.by || currentUser(); arr.push(obj); } }
  Store.mark(coll); return obj;
}
function remove(coll, id) { DB[coll] = DB[coll].filter(x => x.id !== id); Store.mark(coll); }
function setKV(coll, k, v) { DB[coll][k] = v; Store.mark(coll); }

/* 日期工具 */
const DAY = 86400000;
function today() { return ymd(new Date()); }
function ymd(d) { d = new Date(d); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function nowISO() { return new Date().toISOString(); }
function addDays(s, n) { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return ymd(d); }
function diffDays(a, b) { return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / DAY); }
function roc(s) { if (!s) return ''; const [y, m, d] = s.split('-'); return `${+y - 1911}/${m}/${d}`; }
function age(birth) { if (!birth) return ''; const b = new Date(birth), n = new Date(); let a = n.getFullYear() - b.getFullYear(); if (n < new Date(n.getFullYear(), b.getMonth(), b.getDate())) a--; return a; }
function quarterOf(s) { const d = new Date(s + 'T00:00:00'); return d.getFullYear() + '-Q' + (Math.floor(d.getMonth() / 3) + 1); }
function quarterRange(q) { const [y, n] = q.split('-Q').map(Number); const s = new Date(y, (n - 1) * 3, 1), e = new Date(y, n * 3, 0); return [ymd(s), ymd(e)]; }
function monthRange(m) { const [y, n] = m.split('-').map(Number); return [ymd(new Date(y, n - 1, 1)), ymd(new Date(y, n, 0))]; }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function currentUser() { if (typeof Cloud !== 'undefined' && Cloud.on && Cloud.profile) return `${Cloud.profile.name}（${Cloud.profile.role}）`; const u = DB.settings.user; return u ? `${u.name}（${u.role}）` : '未設定'; }

/* ---- logic.js ---- */
/* 規則引擎：到期提醒、品質指標、評鑑佐證 */
function activeResidents(onDate) {
  const d = onDate || today();
  return DB.residents.filter(r => r.admitDate && r.admitDate <= d && (!r.dischargeDate || r.dischargeDate >= d))
    .sort((a, b) => (a.bed || '').localeCompare(b.bed || '', 'zh-Hant', { numeric: true }));
}
function inHouse(r) { return !r.dischargeDate && r.status !== '退住' && r.status !== '往生'; }
function resById(id) { return DB.residents.find(r => r.id === id); }
function resLabel(r) { return r ? `${r.bed || ''} ${r.name}` : '（已刪除）'; }
function byRes(coll, rid) { return DB[coll].filter(x => x.rid === rid).sort((a, b) => (b.date || '').localeCompare(a.date || '')); }
function latestAssess(rid) {
  const out = {};
  DB.assessments.filter(a => a.rid === rid).sort((a, b) => b.date.localeCompare(a.date)).forEach(a => { if (!out[a.type]) out[a.type] = a; });
  return out;
}
function latestContact(rid, kind) { return DB.contacts.filter(c => c.rid === rid && c.kind === kind).sort((a, b) => b.date.localeCompare(a.date))[0]; }
function latestPlan(rid) { return DB.plans.filter(p => p.rid === rid).sort((a, b) => b.date.localeCompare(a.date))[0]; }
function weightsOf(rid) { return DB.weights.filter(w => w.rid === rid).sort((a, b) => a.date.localeCompare(b.date)); }
function activeRestraint(rid) { return DB.restraints.find(x => x.rid === rid && !x.endDate); }
function contactEvery(k) { return k === '醫師巡診' ? facType().doctor : (CONTACT_KINDS[k] || {}).every || 0; }
function scaleCycle(t) { return t === 'social' || accVer() !== 'elder' ? SCALES[t].cycle : facType().cycle; }
function isSummer(d) { const m = +d.slice(5, 7); return m >= 6 && m <= 9; }

/* 體重：30 天內 ±5% */
function weightAlert(rid) {
  const ws = weightsOf(rid); if (ws.length < 2) return null;
  const last = ws[ws.length - 1];
  const prev = ws.filter(w => diffDays(w.date, last.date) >= 1 && diffDays(w.date, last.date) <= 31);
  for (const p of prev) { const pct = (last.kg - p.kg) / p.kg * 100; if (Math.abs(pct) >= 5) return { pct, from: p, to: last }; }
  return null;
}

/* ===== 提醒引擎 ===== */
function buildReminders() {
  const T = today(), list = [];
  // 舊住民（入住已久卻無紀錄）從今天起算，不顯示上千天的逾期
  const firstDue = (admit, days) => diffDays(admit, T) > days + 30 ? T : addDays(admit, days);
  const push = (o) => list.push(Object.assign({ level: 'warn' }, o));
  const status = (due) => { const d = diffDays(T, due); return d < 0 ? 'bad' : d <= 7 ? 'warn' : 'info'; };
  activeResidents().forEach(r => {
    if (!inHouse(r)) return;
    const la = latestAssess(r.id), daysIn = diffDays(r.admitDate, T);
    // B2 入住 72 小時評估與每 3 個月評估
    // 同一住民同類到期的量表合併成一筆，處理時依序帶出
    const first = [], periodic = [];
    CORE_SCALES.forEach(t => {
      const a = la[t];
      if (!a || a.date < r.admitDate) first.push(t);
      else { const due = addDays(a.date, scaleCycle(t)); if (diffDays(T, due) <= 14) periodic.push([t, due, a.date]); }
    });
    if (first.length) { const old = diffDays(r.admitDate, T) > 33; const due = firstDue(r.admitDate, 3); push({ rid: r.id, cat: '評估', ref: 'B2', title: `${old ? '尚無評估紀錄，請補做定期評估' : '入住 72 小時評估'}：${first.map(t => SCALES[t].short).join('、')}`, due, level: status(due), act: `assess:${r.id}:${first.join(',')}` }); }
    if (periodic.length) { periodic.sort((x, y) => x[1].localeCompare(y[1])); const due = periodic[0][1]; push({ rid: r.id, cat: '評估', ref: 'B2', title: `每 ${Math.round(facType().cycle / 30)} 個月定期評估：${periodic.map(p => SCALES[p[0]].short).join('、')}（上次 ${roc(periodic[0][2])}）`, due, level: status(due), act: `assess:${r.id}:${periodic.map(p => p[0]).join(',')}` }); }
    // 照顧計畫
    const p = latestPlan(r.id);
    if (!p) { const due = firstDue(r.admitDate, 3); push({ rid: r.id, cat: '照顧計畫', ref: 'B2', title: '擬定個別化照顧計畫', due, level: status(due), act: `plan:${r.id}` }); }
    else {
      const fam = p.familyDate || '';
      const due = addDays(fam || p.date, 183);
      if (!fam) push({ rid: r.id, cat: '照顧計畫', ref: 'B2', title: '照顧計畫尚未與家屬共同討論', due: addDays(p.date, 30), level: status(addDays(p.date, 30)), act: `plan:${r.id}` });
      else if (diffDays(T, due) <= 14) push({ rid: r.id, cat: '照顧計畫', ref: 'B2', title: `每半年與家屬共同修正照顧計畫（上次 ${roc(fam)}）`, due, level: status(due), act: `plan:${r.id}` });
      const evalDue = (p.problems || []).map(x => x.evalDate).filter(Boolean).sort()[0];
      if (evalDue && diffDays(T, evalDue) <= 7) push({ rid: r.id, cat: '照顧計畫', ref: 'B2', title: '照顧問題到期評值', due: evalDue, level: status(evalDue), act: `plan:${r.id}` });
    }
    // 醫師、藥師、家屬、健檢
    Object.entries(CONTACT_KINDS).forEach(([k, c0]) => {
      const c = Object.assign({}, c0, { every: contactEvery(k) }); if (!c.every) return;
      if (k === '家屬電訪／會談' && r.noFamily) return;
      const last = latestContact(r.id, k);
      let due;
      if (!last) due = firstDue(r.admitDate, k === '醫師巡診' ? 30 : k === '年度健康檢查' ? 365 : c.every);
      else due = addDays(last.date, c.every);
      if (diffDays(T, due) <= (c.every >= 90 ? 14 : 5)) push({ rid: r.id, cat: '訪視聯繫', ref: c.ref, title: `${k}${last ? `（上次 ${roc(last.date)}）` : k === '醫師巡診' ? '：新入住 1 個月內完成醫師診察' : ''}`, due, level: status(due), act: `contact:${r.id}:${k}` });
    });
    // 約束
    const rs = activeRestraint(r.id);
    if (rs) {
      const exp = addDays(rs.consentDate || rs.startDate, 90);
      if (diffDays(T, exp) <= 14) push({ rid: r.id, cat: '約束', ref: 'D11', title: `約束同意書 ${diffDays(T, exp) < 0 ? '已過期' : '即將到期'}（3 個月有效）`, due: exp, level: status(exp), act: `restraint:${rs.id}` });
      if (!(rs.checks || []).some(c => c.date === T)) push({ rid: r.id, cat: '約束', ref: 'B15', title: '今日約束監測與解除評估未記錄', due: T, level: 'warn', act: `restraint:${rs.id}` });
    }
    // 體重
    const ws = weightsOf(r.id), lw = ws[ws.length - 1];
    const wdue = lw ? addDays(lw.date, 30) : firstDue(r.admitDate, 3);
    if (diffDays(T, wdue) <= 3) push({ rid: r.id, cat: '體重', ref: 'B18', title: `每月體重測量${lw ? `（上次 ${roc(lw.date)}）` : ''}`, due: wdue, level: status(wdue), act: `weight:${r.id}` });
    const wa = weightAlert(r.id);
    if (wa && !DB.events.some(e => e.rid === r.id && e.type === '非計畫性體重改變' && e.date >= wa.from.date))
      push({ rid: r.id, cat: '體重', ref: 'B18', title: `30 天內體重${wa.pct > 0 ? '增加' : '減少'} ${Math.abs(wa.pct).toFixed(1)}%，需收案分析`, due: wa.to.date, level: 'bad', act: `event:${r.id}:非計畫性體重改變` });

    if (daysIn >= 7) {
      const baths = DB.daily.filter(d => d.rid === r.id && d.bath && diffDays(d.date, T) < 7 && d.date <= T).length;
      const need = isSummer(T) ? 3 : 2;
      if (baths < need) push({ rid: r.id, cat: '每日', ref: 'B25', title: `近 7 天洗澡 ${baths} 次（${isSummer(T) ? '夏季' : ''}應至少 ${need} 次）`, due: T, level: 'warn', act: 'daily' });
    }
    // 每 2 小時翻身／如廁（昨日）
    if (dY && /臥床/.test(r.mobility || '')) { const n = Object.keys(dY.turns || {}).length; if (n < 10) push({ rid: r.id, cat: '每日', ref: 'B25', title: `昨日翻身紀錄 ${n}/12 次（臥床者每 2 小時）`, due: y, level: n < 6 ? 'bad' : 'warn', act: 'daily' }); }
    if (dY && r.incontinence) { const n = Object.keys(dY.toilets || {}).length; if (n < 8) push({ rid: r.id, cat: '每日', ref: 'B26', title: `昨日定時如廁紀錄 ${n} 次（每 2 小時）`, due: y, level: 'warn', act: 'daily' }); }
    // 異常生命徵象（今日）
    if (dToday) { const ab = vitalFlags(dToday); if (ab.length) push({ rid: r.id, cat: '異常', ref: 'B8 B14', title: `今日異常：${ab.join('、')}`, due: T, level: 'bad', act: `resident:${r.id}` }); }
    // 疫苗（每年 10 月起流感季）
    const season = +T.slice(5, 7) >= 10 ? T.slice(0, 4) : String(+T.slice(0, 4) - 1);
    if (+T.slice(5, 7) >= 10 || +T.slice(5, 7) <= 3) {
      const flu = DB.vaccines.find(v => v.rid === r.id && v.kind === '流感' && v.date >= season + '-09-01');
      if (!flu) push({ rid: r.id, cat: '疫苗', ref: 'B23', title: '本季流感疫苗未接種或未登錄原因', due: season + '-12-31', level: 'info', act: `vaccine:${r.id}` });
    }
    // 長照法 46 條
    if (r.noGuardian && !r.d10Notified) push({ rid: r.id, cat: '權益', ref: 'D10', title: '無扶養義務人／法定代理人：需通知地方主管機關', due: addDays(r.admitDate, 7), level: 'bad', act: `resident:${r.id}` });
    // 未結案事件

      push({ rid: r.id, cat: '事件', ref: EVENT_TYPES[e.type] ? EVENT_TYPES[e.type].ref : '', title: `${e.type}事件待完成原因分析與處置`, due: addDays(e.date, 7), level: status(addDays(e.date, 7)), act: `eventedit:${e.id}` }));
  });
  // 機構層級
  facilityTasks().forEach(t => {
    const last = DB.meetings.filter(m => m.kind === t.kind).sort((a, b) => b.date.localeCompare(a.date))[0];
    const due = last ? addDays(last.date, t.every) : T;
    if (diffDays(T, due) <= 14) push({ rid: null, cat: '機構', ref: t.ref, title: `${t.kind}${last ? `（上次 ${roc(last.date)}）` : '：尚無紀錄'}`, due, level: status(due), act: `meeting:${t.kind}` });
  });
  // 每月指標統計表（下個月 5 日前確認）
  { const d = new Date(T + 'T00:00:00'); d.setDate(0); const pm = ymd(d).slice(0, 7); const md = (DB.settings.qiMonthDone || {})[pm];
    if (!md && DB.residents.length) { const due = `${T.slice(0, 7)}-05`; push({ rid: null, cat: '機構', ref: 'B12–B19', title: `${+pm.slice(0, 4) - 1911} 年 ${+pm.slice(5)} 月指標監測月統計表待確認`, due, level: status(due), act: 'go:qimonth' }); } }
  // 年度分析（隔年 1 月底前）
  { const py = String(+T.slice(0, 4) - 1), Y = (DB.quarterly['Y' + py] || {}).pdca || {}; if (DB.residents.length && +T.slice(5, 7) <= 3 && Object.keys(Y).length < 7) { const due = `${T.slice(0, 4)}-01-31`; push({ rid: null, cat: '機構', ref: 'B12–B19', title: `${+py - 1911} 年度指標分析報告尚未完成`, due, level: status(due), act: 'go:qiyear' }); } }
  // 季分析
  const pq = prevQuarter(quarterOf(T));
  if (!(DB.quarterly[pq] && DB.quarterly[pq].done)) push({ rid: null, cat: '機構', ref: 'B12–B18', title: `${pq.replace('-Q', ' 年第 ')} 季 PDCA 改善報告單尚未完成`, due: addDays(quarterRange(quarterOf(T))[0], 4), level: status(addDays(quarterRange(quarterOf(T))[0], 4)), act: 'go:qipdca' });
  const order = { bad: 0, warn: 1, info: 2 };
  return list.sort((a, b) => order[a.level] - order[b.level] || a.due.localeCompare(b.due));
}
function prevQuarter(q) { let [y, n] = q.split('-Q').map(Number); n--; if (!n) { n = 4; y--; } return `${y}-Q${n}`; }

function vitalFlags(d) {
  const f = [];
  if (d.temp !== '' && d.temp != null && +d.temp >= 37.5) f.push(`體溫 ${d.temp}`);
  if (d.sbp && (+d.sbp >= 180 || +d.sbp < 90)) f.push(`收縮壓 ${d.sbp}`);
  if (d.pulse && (+d.pulse > 110 || +d.pulse < 50)) f.push(`脈搏 ${d.pulse}`);

/* ===== 品質指標 ===== */
function residentDays(from, to) {
  let n = 0;
  DB.residents.forEach(r => {
    if (!r.admitDate) return;
    const s = r.admitDate > from ? r.admitDate : from;
    const end = r.dischargeDate || today(); const e = end < to ? end : to;
    if (e >= s) n += diffDays(s, e) + 1;
  });
  return n;
}
function restraintDays(from, to) {
  let n = 0;
  DB.restraints.forEach(x => { const s = x.startDate > from ? x.startDate : from; const end = x.endDate || today(); const e = end < to ? end : to; if (e >= s) n += diffDays(s, e) + 1; });
  return n;
}
function avgCensus(from, to) { const days = diffDays(from, to < today() ? to : today()) + 1; return days > 0 ? residentDays(from, to) / days : 0; }
function qualityStats(from, to) {
  const rd = residentDays(from, to);
  const ev = t => DB.events.filter(e => e.type === t && e.date >= from && e.date <= to);

  const adlDecline = DB.residents.filter(r => {

    if (as.length < 2) return false; const last = as[as.length - 1]; if (last.date < from) return false;
    return last.score < as[as.length - 2].score;
  }).length;
  const painHigh = DB.daily.filter(d => d.date >= from && d.date <= to && +d.pain >= 4).length;
  return {
    rd, census: census.toFixed(1),
    rows: [
      { key: '跌倒', ref: 'B12', n: ev('跌倒').length, rate: per1000(ev('跌倒').length), unit: '‰ 人日', inj: ev('跌倒').filter(e => e.injury && !e.injury.startsWith('無')).length },
      { key: '壓力性損傷（機構內新發生）', ref: 'B13', n: pi.length, rate: per1000(pi.length), unit: '‰ 人日' },
      { key: '約束', ref: 'B15', n: DB.restraints.filter(x => x.startDate <= to && (!x.endDate || x.endDate >= from)).length, rate: rd ? restraintDays(from, to) / rd * 100 : 0, unit: '% 人日' },
      { key: '感染', ref: 'B16', n: ev('感染').length, rate: per1000(ev('感染').length), unit: '‰ 人日' },
      { key: '非計畫性住院', ref: 'B17', n: ev('非計畫性住院').length, rate: per1000(ev('非計畫性住院').length), unit: '‰ 人日' },
      { key: '非計畫性體重改變', ref: 'B18', n: ev('非計畫性體重改變').length, rate: census ? ev('非計畫性體重改變').length / census * 100 : 0, unit: '% 平均住民' },
      { key: '管路滑脫／自拔', ref: 'B19', n: ev('管路滑脫／自拔').length, rate: per1000(ev('管路滑脫／自拔').length), unit: '‰ 人日' },
      { key: '管路成功移除', ref: 'B19', n: tubesRemoved, rate: null, unit: '件' },

      { key: 'ADL 退步', ref: 'B27', n: adlDecline, rate: census ? adlDecline / census * 100 : 0, unit: '% 平均住民' },

}

/* 表單產生器 */
function field(f, v) {
  const val = v ?? f.def ?? '';
  const cls = 'f' + (f.req ? ' req' : '');
  const lab = `<span>${esc(f.label)}</span>`;
  const ph = f.ph ? ` placeholder="${esc(f.ph)}"` : '';
  if (f.type === 'select') return `<label class="${cls}">${lab}<select name="${f.key}">${f.blank === false ? '' : '<option value="">－請選擇－</option>'}${f.options.map(o => { const [ov, ol] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(ov)}"${String(ov) === String(val) ? ' selected' : ''}>${esc(ol)}</option>`; }).join('')}</select></label>`;
  if (f.type === 'textarea') return `<label class="${cls}">${lab}<textarea name="${f.key}"${ph}>${esc(val)}</textarea></label>`;
  if (f.type === 'checks') { const arr = Array.isArray(val) ? val : []; return `<div class="f"><span class="small muted">${esc(f.label)}${f.req ? ' <span style="color:var(--bad)">*</span>' : ''}</span><div class="checks" data-checks="${f.key}">${f.options.map(o => `<label><input type="checkbox" value="${esc(o)}"${arr.includes(o) ? ' checked' : ''}> ${esc(o)}</label>`).join('')}</div></div>`; }
  if (f.type === 'bool') return `<div class="checks"><label><input type="checkbox" name="${f.key}"${val ? ' checked' : ''}> ${esc(f.label)}</label></div>`;
  return `<label class="${cls}">${lab}<input name="${f.key}" type="${f.type || 'text'}" value="${esc(val)}"${f.step ? ` step="${f.step}"` : ''}${ph}></label>`;
}
function formHTML(fields, obj = {}, cols = 2) {
  return `<div class="grid g${cols}">${fields.map(f => `<div style="${f.wide ? 'grid-column:1/-1' : ''}">${field(f, obj[f.key])}</div>`).join('')}</div>`;
}
function readForm(fields, root = $('#mbody'), silent) {
  const o = {}; let miss = [];
  fields.forEach(f => {
    if (f.type === 'checks') o[f.key] = $$(`[data-checks="${f.key}"] input:checked`, root).map(i => i.value);
    else if (f.type === 'bool') o[f.key] = !!(root.querySelector(`[name="${f.key}"]`) || {}).checked;
    else { const el = root.querySelector(`[name="${f.key}"]`); o[f.key] = el ? el.value.trim() : ''; if (f.type === 'number' && o[f.key] !== '') o[f.key] = +o[f.key]; }
    if (f.req && (o[f.key] === '' || (Array.isArray(o[f.key]) && !o[f.key].length))) miss.push(f.label);
  });
  if (miss.length) { if (!silent) toast('請填寫：' + miss.join('、'), 'bad'); return silent ? o : null; }

function sparkline(vals, w = 160, h = 36) {
  if (vals.length < 2) return '';

/* ===== 評估進度總表（矩陣） ===== */
ROUTES.matrix = () => {
  const res = activeResidents().filter(inHouse), T = today();
  const cols = [...CORE_SCALES.map(t => ['s', t, SCALES[t].short]), ['p', 'plan', '照顧計畫'], ['f', 'fam', '家屬討論'], ['c', '醫師巡診', '醫師'], ['c', '藥師評估', '藥師'], ['c', '家屬電訪／會談', '家屬電訪'], ['w', 'w', '體重']];
  const cell = (r, [k, x]) => {
    let last, cycle, act;
    if (k === 's') { const a = latestAssess(r.id)[x]; last = a && a.date >= r.admitDate ? a.date : null; cycle = scaleCycle(x); act = `assess:${r.id}:${x}`; if (!last) { const due = addDays(r.admitDate, 3); return [due < T ? 'bad' : 'warn', due < T ? '未評估' : '72h 內', act]; } }
    else if (k === 'p') { const p = latestPlan(r.id); last = p && p.date; cycle = 92; act = `plan:${r.id}`; if (!last) return [diffDays(r.admitDate, T) > 3 ? 'bad' : 'warn', '未擬定', act]; }
    else if (k === 'f') { const p = latestPlan(r.id); last = p && p.familyDate; cycle = 183; act = `plan:${r.id}`; if (!last) return [diffDays(r.admitDate, T) > 30 ? 'bad' : 'warn', '未討論', act]; }
    else if (k === 'c') { if (x === '家屬電訪／會談' && r.noFamily) return ['na', '不適用', '']; const c = latestContact(r.id, x); last = c && c.date; cycle = contactEvery(x); act = `contact:${r.id}:${x}`; if (!last) { const d = diffDays(r.admitDate, T); return [d > cycle ? 'bad' : 'warn', '無紀錄', act]; } }
    else if (k === 'w') { const w = weightsOf(r.id).pop(); last = w && w.date; cycle = 31; act = `weight:${r.id}`; if (!last) return ['bad', '無紀錄', act]; }
    const due = addDays(last, cycle), d = diffDays(T, due);
    return [d < 0 ? 'bad' : d <= 14 ? 'warn' : 'ok', roc(last).slice(roc(last).indexOf('/') + 1), act];
  };
  let nbad = 0; const rows = res.map(r => { const cs = cols.map(c => cell(r, c)); nbad += cs.filter(c => c[0] === 'bad').length; return `<tr><td class="nowrap"><a href="#/r/${r.id}">${esc(resLabel(r))}</a></td>${cs.map(([cls, txt, act]) => `<td><button class="cell ${cls}" ${act ? `data-act="doRem" data-a="${esc(act)}"` : ''} title="${cls === 'bad' ? '逾期' : cls === 'warn' ? '14 天內到期' : ''}">${esc(txt)}</button></td>`).join('')}</tr>`; });
  return `<h1>評估進度總表</h1><p class="sub">一眼看出每位住民各項評估與訪視是否在期限內（評估每 ${Math.round(facType().cycle / 30)} 個月、每半年家屬討論、醫師巡診每 ${Math.round(facType().doctor / 30)} 個月、每季藥師、每季家屬電訪、每月體重）。格子顯示上次日期，點格子直接處理。</p>
  <div class="row chips"><span class="cell ok">期限內</span><span class="cell warn">14 天內到期</span><span class="cell bad">逾期／未做</span><span class="sp"></span><span class="chip ${nbad ? 'bad' : 'ok'}">逾期 ${nbad} 格</span><button class="btn sm" data-act="printMatrix">列印總表</button></div>
  <div class="card" style="padding:0"><div class="tw"><table class="t matrix"><tr><th>住民</th>${cols.map(c => `<th>${c[2]}</th>`).join('')}</tr>${rows.join('') || '<tr><td colspan="20" class="empty">尚無在住住民</td></tr>'}</table></div></div>`;
};

  const d = dailyDate || today();

/* ===== 品質指標 ===== */
function recentQuarters(n) { const out = []; let q = quarterOf(today()); for (let i = 0; i < n; i++) { out.push(q); q = prevQuarter(q); } return out; }
ROUTES.quality = (q) => {
  q = q || quarterOf(today());
  const [f, t] = quarterRange(q);
  const months = [0, 1, 2].map(i => { const d = new Date(f + 'T00:00:00'); d.setMonth(d.getMonth() + i); return ymd(d).slice(0, 7); });
  const ms = months.map(m => qualityStats(...monthRange(m)));
  const qs = qualityStats(f, t);
  const hist = recentQuarters(4).reverse().map(x => [x, qualityStats(...quarterRange(x))]);
  const Q = DB.quarterly[q] || { analysis: {} };
  const fmt = (row, a, b) => { const inner = row.rate === null ? row.n : `${row.n}<div class="small muted">${row.rate.toFixed(2)} ${row.unit}</div>`; return row.n ? `<button class="qcell" data-act="qDrill" data-k="${esc(row.key)}" data-f="${a}" data-t="${b}" title="點開看是哪幾件">${inner}</button>` : inner; };
  return `${qiTabs('quality')}<div class="hd"><div><h1>品質指標</h1><p class="sub">由事件登錄、約束、體重、評估資料自動計算。人日數 = 每位住民在機構的天數加總。每季完成分析檢討即符合 B12–B18「定期（每季）分析」。</p></div><span class="sp"></span>
    <select id="qSel" style="padding:7px;border:1px solid var(--line);border-radius:8px">${recentQuarters(8).map(x => `<option value="${x}"${x === q ? ' selected' : ''}>${x.replace('-Q', ' 年第 ')} 季${x === quarterOf(today()) ? '（本季）' : ''}</option>`).join('')}</select></div>
  <p class="small muted" style="margin-top:-6px">數字可以點開看是哪幾件；右邊趨勢長條點一下切換季度。</p>
  <div class="grid g4"><div class="kpi"><div class="n">${qs.rd}</div><div class="l">本季住民人日數</div></div><div class="kpi"><div class="n">${qs.census}</div><div class="l">平均每日在住</div></div>
    <div class="kpi ${Q.done ? 'ok' : 'warn'}"><div class="n">${Q.done ? '已完成' : '未完成'}</div><div class="l">本季分析檢討</div></div><div class="kpi"><div class="n">${DB.events.filter(e => e.date >= f && e.date <= t).length}</div><div class="l">本季事件總數</div></div></div>
  <div class="card" style="margin-top:16px;padding:0"><div class="tw"><table class="t"><tr><th>指標</th>${months.map(m => `<th>${+m.slice(5)} 月</th>`).join('')}<th>本季</th><th>近 4 季趨勢</th></tr>
  ${qs.rows.map((row, i) => { const h = hist.map(([, s]) => s.rows[i].rate ?? s.rows[i].n); const mx = Math.max(...h, 0.0001);
    return `<tr><td>${esc(row.key)} ${refChip(row.ref)}</td>${ms.map((s, mi) => `<td>${fmt(s.rows[i], ...monthRange(months[mi]))}</td>`).join('')}<td><b>${fmt(row, f, t)}</b></td>
    <td><div style="display:flex;gap:3px;align-items:flex-end;height:30px">${h.map((v, j) => `<button data-act="qGo" data-q="${hist[j][0]}" title="${hist[j][0]}：${typeof v === 'number' ? v.toFixed(2) : v}（點一下切換到這一季）" style="width:18px;padding:0;border:0;cursor:pointer;height:${Math.max(3, v / mx * 28)}px;background:${hist[j][0] === q ? 'var(--pri)' : 'var(--line)'};border-radius:2px"></button>`).join('')}</div></td></tr>`; }).join('')}</table></div></div>
  <div class="banner info">每季的正式分析請到「<a href="#/qipdca">季 PDCA</a>」填寫 PDCA 改善報告單，每月報表在「<a href="#/qimonth">月統計表</a>」。</div><h2>本季分析與改善方案（簡式）</h2><p class="sub">逐項填寫後按「完成本季分析」。建議於品質會議中討論並記錄於「會議與活動」。</p>
  <div id="qForm">${qs.rows.filter(r => r.rate !== null || r.key.startsWith('管路成功')).map(row => { const a = (Q.analysis || {})[row.key] || {}; const evs = DB.events.filter(e => row.key.startsWith(e.type) && e.date >= f && e.date <= t);
    return `<div class="card"><div class="row"><b>${esc(row.key)}</b>${refChip(row.ref)}<span class="sp"></span><span class="chip">${row.n} 件</span></div>
    ${evs.length ? `<div class="small muted" style="margin:6px 0">${evs.map(e => `${roc(e.date)} ${esc(resById(e.rid) ? resById(e.rid).name : '')}：${esc((e.cause || '未分析').slice(0, 30))}`).join('；')}</div>` : ''}
    <div class="grid g2"><label class="f">分析（趨勢、共同原因）<textarea data-qk="${esc(row.key)}" data-qf="a">${esc(a.a || '')}</textarea></label><label class="f">檢討與改善方案<textarea data-qk="${esc(row.key)}" data-qf="b">${esc(a.b || '')}</textarea></label></div></div>`; }).join('')}</div>
  <div class="row"><button class="btn" data-act="qSave" data-q="${q}">暫存</button><button class="btn pri" data-act="qDone" data-q="${q}">完成本季分析</button><button class="btn" data-act="printQuarter" data-q="${q}">列印季報告</button></div>`;
};
const QKEY_TYPE = { '跌倒': ['跌倒'], '壓力性損傷（機構內新發生）': ['壓力性損傷'], '感染': ['感染'], '非計畫性住院': ['非計畫性住院'], '非計畫性體重改變': ['非計畫性體重改變'], '管路滑脫／自拔': ['管路滑脫／自拔'], '管路成功移除': ['管路移除'] };
ACT.qGo = el => go('quality/' + el.dataset.q);
ACT.qDrill = el => {
  const k = el.dataset.k, f = el.dataset.f, t = el.dataset.t; let html = '';
  if (QKEY_TYPE[k]) {
    const list = DB.events.filter(e => QKEY_TYPE[k].includes(e.type) && e.date >= f && e.date <= t).sort((a, b) => a.date.localeCompare(b.date));
    html = `<table class="t"><tr><th>日期</th><th>住民</th><th>經過</th><th>分析</th><th></th></tr>${list.map(e => `<tr><td class="nowrap">${roc(e.date)}</td><td class="nowrap">${esc(resLabel(resById(e.rid)))}</td><td class="small">${esc((e.desc || '').slice(0, 60))}</td><td>${e.cause && e.action ? '<span class="chip ok">已分析</span>' : '<span class="chip bad">待分析</span>'}</td><td><button class="btn sm" data-act="qOpenEv" data-id="${e.id}">開啟</button></td></tr>`).join('')}</table>`;
  } else if (k === '約束') {
    const list = DB.restraints.filter(x => x.startDate <= t && (!x.endDate || x.endDate >= f));
    html = `<table class="t"><tr><th>住民</th><th>期間</th><th>目的</th></tr>${list.map(x => `<tr><td>${esc(resLabel(resById(x.rid)))}</td><td>${roc(x.startDate)}～${x.endDate ? roc(x.endDate) : '持續中'}</td><td>${esc((x.reasons || []).join('、'))}</td></tr>`).join('')}</table>`;
  } else if (/疼痛/.test(k)) {
    const list = DB.daily.filter(d => d.date >= f && d.date <= t && +d.pain >= 4).sort((a, b) => a.date.localeCompare(b.date));
    html = `<table class="t"><tr><th>日期</th><th>住民</th><th>疼痛分數</th></tr>${list.map(d => `<tr><td>${roc(d.date)}</td><td>${esc(resLabel(resById(d.rid)))}</td><td>${d.pain}</td></tr>`).join('')}</table>`;
  } else html = '<p class="small muted">此指標由評估資料計算，請到住民個人頁查看評估紀錄。</p>';
  openModal(`${k}｜${roc(f)}～${roc(t)}`, html, null);
};
ACT.qOpenEv = el => { closeModal(); openEvent(el.dataset.id); };
ROUTES.after_quality = () => { $('#qSel').addEventListener('change', e => go('quality/' + e.target.value)); };
function readQ(q) { const Q = DB.quarterly[q] || { analysis: {} }; Q.analysis = Q.analysis || {}; $$('#qForm textarea').forEach(t => { (Q.analysis[t.dataset.qk] = Q.analysis[t.dataset.qk] || {})[t.dataset.qf] = t.value; }); return Q; }
ACT.qSave = el => { setKV('quarterly', el.dataset.q, readQ(el.dataset.q)); toast('已暫存'); };
ACT.qDone = el => { const Q = readQ(el.dataset.q); const empty = Object.values(Q.analysis).filter(x => !x.a && !x.b).length; if (empty > 3) { toast(`還有 ${empty} 項未填寫分析`, 'bad'); return; } Q.done = true; Q.doneDate = today(); Q.by = currentUser(); setKV('quarterly', el.dataset.q, Q); toast('本季分析已完成'); refresh(); };

/* ===== 評鑑準備 ===== */

ROUTES.accred = () => {
  const A = DB.accred;
  const all = accredFlat(); const core = all.filter(x => x.core); const SET = accredSet(); const elder = accVer() === 'elder';
  const rated = all.filter(x => A[x.code] && A[x.code].r).length;
  const coreOk = core.filter(x => A[x.code] && ['A', 'B'].includes(A[x.code].r)).length;
  const autoBad = all.filter(x => { const e = accredEvidence(x.code); return e && e[0] === 'bad'; });
  return `<div class="hd"><div><h1>評鑑準備</h1><p class="sub">${esc(accredName())}：${SET.map(c => `${c.cat} ${c.items.length} 項`).join('、')}，${elder ? '一級必要項目' : '核心指標'} ${core.length} 項。系統能自動計算的項目會顯示即時佐證。${elder ? '<br>臺中市社會局每 4 年評鑑一次，指標於評鑑前 6 個月公告；公告後請以臺中市版本核對。' : ''}</p></div><span class="sp"></span><button class="btn" data-act="printAccred">列印自評表</button></div>
  <div class="grid g4"><div class="kpi"><div class="n">${rated}/${all.length}</div><div class="l">已自評</div></div><div class="kpi ${coreOk === core.length ? 'ok' : 'warn'}"><div class="n">${coreOk}/${core.length}</div><div class="l">${elder ? '一級必要項目' : '核心指標'}自評達 B 以上</div></div>
    <div class="kpi ${autoBad.length ? 'bad' : 'ok'}"><div class="n">${autoBad.length}</div><div class="l">系統偵測需補強</div></div><div class="kpi"><div class="n">${roc(today())}</div><div class="l">${elder ? '臺中市 109 年評鑑：優等' : '評鑑期間 115/7–9 月'}</div></div></div>
  ${autoBad.length ? `<div class="banner bad" style="margin-top:14px">需補強：${autoBad.map(x => `<b>${x.code}</b> ${esc(x.title)}`).join('、')}</div>` : ''}
  <div class="row" style="margin:14px 0"><div class="chips" style="margin:0">${SET.map(c => `<button class="chip ${c.cat === accOpen ? 'on' : ''}" data-act="accCat" data-c="${c.cat}">${c.cat}. ${c.name}</button>`).join('')}</div><span class="sp"></span><label class="small row" style="gap:4px"><input type="checkbox" data-act="accCore" ${accOnlyCore ? 'checked' : ''}> 只看${elder ? '一級必要項目' : '核心指標'}</label></div>
  ${all.filter(x => x.cat === accOpen && (!accOnlyCore || x.core)).map(x => { const ev = accredEvidence(x.code); const s = A[x.code] || {};
    return `<details class="acc-item" ${ev && ev[0] === 'bad' ? 'open' : ''}><summary><span class="code">${x.code}</span><span style="flex:1">${esc(x.title)} ${x.core ? `<span class="chip bad">${elder ? '一級必要' : '核心'}</span>` : ''}</span>${ev ? `<span class="chip ${ev[0]}">${ev[0] === 'ok' ? '佐證完整' : ev[0] === 'bad' ? '需補強' : ev[0] === 'warn' ? '注意' : '資訊'}</span>` : ''}${s.r ? `<span class="chip pri">自評 ${s.r}</span>` : ''}</summary>
    <div class="body"><p>${esc(x.desc)}</p>${ev ? `<div class="banner ${ev[0] === 'ok' ? 'info' : ev[0]}" style="margin:6px 0">系統佐證：${esc(ev[1])}</div>` : '<p class="small muted">此項需以文件、現場察看佐證，請於備註記錄準備狀況與文件位置。</p>'}
    <div class="row"><span class="small muted">自評</span><div class="rating">${['A', 'B', 'C', 'D', 'E'].map(g => `<button data-act="accRate" data-c="${x.code}" data-g="${g}" class="${s.r === g ? 'on' : ''}">${g}</button>`).join('')}</div></div>
    <label class="f" style="margin-top:8px">準備狀況／佐證文件位置<textarea data-accnote="${x.code}" placeholder="例：工作手冊第 3 章；114 年品質會議紀錄 4 份">${esc(s.note || '')}</textarea></label></div></details>`; }).join('')}`;
};
ROUTES.after_accred = () => { $$('[data-accnote]').forEach(t => t.addEventListener('change', () => { const c = t.dataset.accnote; setKV('accred', c, Object.assign({}, DB.accred[c], { note: t.value })); toast('已儲存備註'); })); };

/* --- 照片：壓縮後存在本機 IndexedDB（有密碼時加密），中繼資料在 DB.photos --- */
const PhotoCache = new Map();
function compressImage(file, max = 1600, q = 0.72) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      res({ data: c.toDataURL('image/jpeg', q), w: c.width, h: c.height });
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('無法讀取這張圖片')); };
    img.src = url;
  });
}
async function addPhotos(files, owner) {
  let n = 0;
  for (const f of files) {
    if (!/^image\//.test(f.type)) continue;
    try {
      const { data, w, h } = await compressImage(f);
      const id = uid();
      const encd = await Store.enc(data); await Store.rawSet('ph:' + id, encd);
      if (Cloud.on) Cloud.uploadPhoto(id, encd);
      PhotoCache.set(id, data);
      DB.photos.push({ id, owner, date: today(), w, h, size: Math.round(data.length * 0.75), caption: '', by: currentUser(), created: nowISO() });
      n++;
    } catch (e) { toast(e.message, 'bad'); }
  }
  Store.mark('photos'); Folder.schedule();
  return n;
}
async function getPhoto(id) {
  if (PhotoCache.has(id)) return PhotoCache.get(id);
  let v = await Store.rawGet('ph:' + id);
  if (!v && Cloud.on) { v = await Cloud.downloadPhoto(id); if (v) await Store.rawSet('ph:' + id, v); }
  if (!v) return null;
  const d = await Store.dec(v); PhotoCache.set(id, d); return d;
}
async function delPhoto(id) {
  DB.photos = DB.photos.filter(p => p.id !== id); PhotoCache.delete(id); Store.mark('photos');
  if (Store.idb) await new Promise(r => { const tx = Store.idb.transaction('kv', 'readwrite'); tx.objectStore('kv').delete('ph:' + id); tx.oncomplete = r; tx.onerror = r; });
  Folder.removePhoto(id); if (Cloud.on) Cloud.deletePhoto(id);
}
function photosOf(owner) { return DB.photos.filter(p => p.owner === owner); }
function ownerExists(owner) {
  const [k, id] = owner.split(':');
  return k === 'event' ? DB.events.some(e => e.id === id) : k === 'meeting' ? DB.meetings.some(m => m.id === id) : k === 'res' ? DB.residents.some(r => r.id === id) : true;
}
async function cleanupOrphans() { for (const p of DB.photos.filter(p => !ownerExists(p.owner))) await delPhoto(p.id); }
function photoStrip(owner, opts = {}) {
  const ps = photosOf(owner);

    ${opts.readonly ? '' : `<label class="ph add" title="新增照片（可直接用手機拍照）">＋ 照片<input type="file" accept="image/*" multiple hidden data-photo-owner="${owner}"></label>`}</div>
    ${opts.hint ? `<div class="small muted">${opts.hint}</div>` : ''}`;
}
async function hydratePhotos(root = document) { for (const img of $$('img[data-ph]:not([src])', root)) { const d = await getPhoto(img.dataset.ph); if (d) img.src = d; } }

/* --- 資料夾自動存檔（Chrome / Edge 的 File System Access） --- */
const Folder = {
  handle: null, ok: false, timer: null, lastWrite: null, err: '',
  supported() { return 'showDirectoryPicker' in window; },
  async init() {
    if (!this.supported() || !Store.idb) return;
    const h = await Store.rawGet('__dir'); if (!h || typeof h !== 'object') return;
    this.handle = h;
    try { this.ok = (await h.queryPermission({ mode: 'readwrite' })) === 'granted'; } catch (e) { this.ok = false; }
  },
  async choose() {
    try { this.handle = await window.showDirectoryPicker({ id: 'ltc-data', mode: 'readwrite' }); }
    catch (e) { if (e.name !== 'AbortError') toast('無法使用這個資料夾：' + e.message, 'bad'); return false; }
    await Store.rawSet('__dir', this.handle); this.ok = true;
    let existing = null;
    try { const fh = await this.handle.getFileHandle('長照照護資料.json'); existing = JSON.parse(await (await fh.getFile()).text()); } catch (e) {}
    if (existing && existing.__app === 'ltc-facility') {
      this.ok = false; // 先暫停，避免覆蓋既有資料
      openModal('這個資料夾已有資料', `<p>資料夾內已有 ${esc(existing.org || '')} 的資料（最後存檔 ${existing.__at ? new Date(existing.__at).toLocaleString() : ''}）。</p>
        <p class="small">・如果這是新電腦，請選「從資料夾還原」。<br>・只有確定這台電腦的資料比較新，才選「以這台電腦覆蓋」。</p>`, null,
        { extraBtn: `<button class="btn pri" data-act="folderRestoreHere">從資料夾還原</button><button class="btn danger" data-act="folderOverwrite">以這台電腦覆蓋</button>` });
      return false;
    }
    await this.writeAll(true); return true;
  },
  async regrant(noWrite) {
    if (!this.handle) return false;
    try { this.ok = (await this.handle.requestPermission({ mode: 'readwrite' })) === 'granted'; } catch (e) { this.ok = false; }
    if (this.ok && !noWrite) { await this.writeAll(); toast('已恢復自動存檔到資料夾'); }
    return this.ok;
  },
  async unlink() { this.handle = null; this.ok = false; if (Store.idb) await new Promise(r => { const tx = Store.idb.transaction('kv', 'readwrite'); tx.objectStore('kv').delete('__dir'); tx.oncomplete = r; }); },
  schedule() { if (!this.ok) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.writeAll(), 3000); },
  async file(dir, name, content) { const fh = await dir.getFileHandle(name, { create: true }); const w = await fh.createWritable(); await w.write(content); await w.close(); },
  async writeAll(full) {
    if (!this.ok || !this.handle) return;
    try {
      const payload = await buildBackup(false);
      await this.file(this.handle, '長照照護資料.json', payload);
      const snap = await this.handle.getDirectoryHandle('每日備份', { create: true });
      await this.file(snap, `備份_${today()}.json`, payload);
      const names = []; for await (const [n] of snap.entries()) if (/^備份_\d{4}-\d{2}-\d{2}\.json$/.test(n)) names.push(n);
      names.sort(); const keep = +(DB.settings.snapDays || 60);
      for (const n of names.slice(0, Math.max(0, names.length - keep))) await snap.removeEntry(n);
      const pd = await this.handle.getDirectoryHandle('照片', { create: true });
      const have = new Set(); for await (const [n] of pd.entries()) have.add(n.split('.')[0]);
      for (const p of DB.photos) if (!have.has(p.id)) {
        const d = await getPhoto(p.id); if (!d) continue;
        if (Store.key) await this.file(pd, `${p.id}.enc.txt`, await Store.enc(d));
        else await this.file(pd, `${p.id}.jpg`, await (await fetchDataURL(d)).blob());
      }
      this.lastWrite = nowISO(); this.err = '';
    } catch (e) { this.err = e.message; if (e.name === 'NotAllowedError') this.ok = false; console.error(e); }
  },
  async removePhoto(id) {
    if (!this.ok || !this.handle) return;
    try { const pd = await this.handle.getDirectoryHandle('照片', { create: true }); for (const n of [`${id}.jpg`, `${id}.enc.txt`]) { try { await pd.removeEntry(n); } catch (e) {} } } catch (e) {}
  },
  async restore() {
    if (!this.handle) return;
    try {
      const fh = await this.handle.getFileHandle('長照照護資料.json'); const txt = await (await fh.getFile()).text();
      const photos = {};
      try { const pd = await this.handle.getDirectoryHandle('照片'); for await (const [n, h] of pd.entries()) { const id = n.split('.')[0]; const f = await h.getFile(); photos[id] = n.endsWith('.enc.txt') ? { enc: await f.text() } : { data: await blobToDataURL(f) }; } } catch (e) {}
      await restoreBackup(txt, photos);
    } catch (e) { toast('資料夾內找不到「長照照護資料.json」', 'bad'); }
  },
};
function fetchDataURL(d) { const [h, b] = d.split(','); const bin = atob(b); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return Promise.resolve(new Response(new Blob([u], { type: h.slice(5, h.indexOf(';')) }))); }
function blobToDataURL(b) { return new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); }); }

/* --- 備份檔格式（下載與資料夾共用）：有密碼時整包加密 --- */
async function buildBackup(withPhotos) {
  if (Cloud.on) return buildCloudBackup(withPhotos);
  const data = {}; COLLECTIONS.forEach(c => data[c] = DB[c]);
  if (withPhotos) { data.__photos = {}; for (const p of DB.photos) data.__photos[p.id] = await getPhoto(p.id); }
  const head = { __app: 'ltc-facility', __ver: 2, __at: nowISO(), org: DB.settings.org || '' };
  if (Store.key) return JSON.stringify(Object.assign(head, { enc: true, salt: b64(Store.salt), data: await Store.enc(JSON.stringify(data)) }));
  return JSON.stringify(Object.assign(head, { data }));
}
async function restoreBackup(txt, folderPhotos) {
  let f; try { f = JSON.parse(txt); } catch (e) { toast('檔案格式錯誤', 'bad'); return; }
  if (f.__app !== 'ltc-facility') { toast('這不是本系統的備份檔', 'bad'); return; }
  let data = f.data || f, key = null, salt = null;
  if (f.enc) {
    const pass = await promptPassword('這份備份有加密，請輸入當時設定的密碼'); if (pass === null) return;
    salt = unb64(f.salt); key = await Store.deriveKey(pass, salt);
    try { const save = Store.key; Store.key = key; data = JSON.parse(await Store.dec(f.data)); Store.key = save; } catch (e) { toast('密碼錯誤，無法解開備份', 'bad'); return; }
  }
  if (Cloud.on && !Cloud.isAdmin()) { toast('雲端版只有主任可以還原備份', 'bad'); return; }
  confirmBox(`將以備份（${f.__at ? new Date(f.__at).toLocaleString() : ''}，住民 ${(data.residents || []).length} 位、照片 ${(data.photos || []).length} 張）<b>覆蓋</b>這台電腦目前的資料，確定？`, async () => {
    const fileKey = key; if (Cloud.on) key = null;
    if (key) { Store.key = key; Store.salt = salt; await Store.rawSet('__meta', JSON.stringify({ enc: true, salt: b64(salt), check: await Store.enc('ok') })); }
    COLLECTIONS.forEach(c => { DB[c] = data[c] || (['settings', 'quarterly', 'accred'].includes(c) ? {} : []); Store.mark(c); });
    const emb = data.__photos || {}; PhotoCache.clear();
    for (const p of DB.photos) {
      let d = emb[p.id];
      const fp = folderPhotos && folderPhotos[p.id];
      if (!d && fp) d = fp.data || (fileKey ? await (async () => { const s = Store.key; Store.key = fileKey; const r = await Store.dec(fp.enc); Store.key = s; return r; })() : null);
      if (d) { const e2 = await Store.enc(d); await Store.rawSet('ph:' + p.id, e2); if (Cloud.on) Cloud.uploadPhoto(p.id, e2); }
    }
    await Store.flush(); if (Folder.handle) Folder.ok = true; toast('已還原'); updateBrand(); go('dash');
  }, '覆蓋還原');
}
function promptPassword(msg) {
  return new Promise(res => {
    openModal('輸入密碼', `<p class="small">${esc(msg)}</p><label class="f">密碼<input type="password" id="ppw"></label>`, () => { const v = $('#ppw').value; setTimeout(() => res(v), 0); }, { saveText: '確定' });
    const c = $('#modal [data-act=closeModal]'); if (c) c.addEventListener('click', () => res(null), { once: true });
  });
}

/* 雲端版的下載備份：另設一組備份密碼加密（與登入密碼無關） */
async function buildCloudBackup(withPhotos) {
  const pass = await promptPassword('為這份備份檔設定一組密碼（至少 10 字元）。還原時需要輸入，請另外保存。');
  if (!pass || pass.length < 10) { toast('備份密碼至少 10 字元', 'bad'); throw new Error('cancel'); }
  const data = {}; COLLECTIONS.forEach(c => data[c] = DB[c]);
  if (withPhotos) { data.__photos = {}; for (const p of DB.photos) data.__photos[p.id] = await getPhoto(p.id); }
  const salt = crypto.getRandomValues(new Uint8Array(16)), k = await Store.deriveKey(pass, salt), keep = Store.key;
  Store.key = k; const enc = await Store.enc(JSON.stringify(data)); Store.key = keep;
  return JSON.stringify({ __app: 'ltc-facility', __ver: 2, __at: nowISO(), org: DB.settings.org || '', enc: true, salt: b64(salt), data: enc });
}

  ['會計憑證', '至少 5 年', '長期照顧服務機構設立許可及管理辦法第 30 條（老人福利機構可比照，並依稅法規定）。'],

/* ===== 雲端模式：Firebase（台灣機房）＋帳號＋兩步驟驗證＋端對端加密 =====
   金鑰設計：
   - 機構資料金鑰 DEK（AES-256）只存在使用者的瀏覽器記憶體；雲端只有「被包起來的 DEK」。
   - 每位員工的密碼在本機導出兩把鑰匙：KEK（解開 DEK）與 登入密碼雜湊（送給 Firebase 驗證）。
     Google 收到的不是原始密碼，也無法用它解開資料。
   - 所有住民資料、照片在上傳前用 DEK 加密；雲端只看得到亂碼。 */
const Cloud = {
  on: typeof CLOUD_CONFIG !== 'undefined', app: null, auth: null, db: null, st: null,
  user: null, profile: null, unsub: null, known: new Map(), pending: new Set(), pulling: false, online: navigator.onLine, status: '',
  ADMIN_ROLES: ['機構主任', '系統管理員'],
  init() {
    const c = CLOUD_CONFIG;
    this.app = FB.initializeApp(c.firebase);
    this.auth = FB.getAuth(this.app);
    this.db = FB.initializeFirestore(this.app, { localCache: FB.memoryLocalCache() });
    this.st = FB.getStorage(this.app);
    if (c.emulator) {
      FB.connectAuthEmulator(this.auth, `http://${location.hostname}:9099`, { disableWarnings: true });
      FB.connectFirestoreEmulator(this.db, location.hostname, 8080);
      FB.connectStorageEmulator(this.st, location.hostname, 9199);
    }
    window.addEventListener('online', () => { this.online = true; this.setStatus(); this.pushPending(); });
    window.addEventListener('offline', () => { this.online = false; this.setStatus(); });
  },
  isAdmin() { return this.profile && this.ADMIN_ROLES.includes(this.profile.role); },
  setStatus(s) { if (s !== undefined) this.status = s; const el = $('#cloudStatus'); if (el) el.innerHTML = this.badge(); },
  badge() {
    if (!this.on) return '';
    if (!this.user) return '<span class="chip warn">離線作業</span>';
    if (!this.online) return '<span class="chip warn">網路中斷・資料暫存本機</span>';
    return this.pending.size ? `<span class="chip warn">同步中 ${this.pending.size}</span>` : '<span class="chip ok">已同步</span>';
  },

  /* --- 金鑰 --- */
  async kdf(pass, saltB64, usage, iter = 310000) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey', 'deriveBits']);
    if (usage === 'bits') return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: new TextEncoder().encode(saltB64), iterations: iter, hash: 'SHA-256' }, base, 256));
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: unb64(saltB64), iterations: iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['wrapKey', 'unwrapKey']);
  },
  async authPw(email, pass) { const b = await this.kdf(pass, 'ltc-auth:' + email.toLowerCase(), 'bits', 100000); return [...b].map(x => x.toString(16).padStart(2, '0')).join(''); },
  async wrap(dek, pass) { const salt = b64(crypto.getRandomValues(new Uint8Array(16))); const kek = await this.kdf(pass, salt); const iv = crypto.getRandomValues(new Uint8Array(12)); const ct = await crypto.subtle.wrapKey('raw', dek, kek, { name: 'AES-GCM', iv }); return { salt, iv: b64(iv), ct: b64(new Uint8Array(ct)) }; },
  async unwrap(w, pass) { const kek = await this.kdf(pass, w.salt); return crypto.subtle.unwrapKey('raw', unb64(w.ct), kek, { name: 'AES-GCM', iv: unb64(w.iv) }, { name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']); },
  async sha256hex(s) { const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(h)].map(x => x.toString(16).padStart(2, '0')).join(''); },
  newCode() { const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; const r = crypto.getRandomValues(new Uint8Array(16)); return [...r].map(x => A[x % 32]).join('').match(/.{4}/g).join('-'); },
  pwProblem(p) { if (p.length < 10) return '密碼至少 10 個字元'; if (!/[A-Za-z]/.test(p) || !/\d/.test(p)) return '密碼需同時包含英文字母與數字'; if (/^(.)\1+$/.test(p) || /(1234|abcd|password|qwer)/i.test(p)) return '密碼太容易猜到'; return ''; },

  /* --- 登入畫面 --- */
  async boot() {

  },
  shell(html) {

  },
  msg(t, ok) { const m = $('#lkMsg'); if (m) { m.style.color = ok ? 'var(--ok)' : 'var(--bad)'; m.textContent = t; } },
  loginScreen(tab = 'login') {

      const forms = {
        login: `<form id="lkForm"><label class="f">電子郵件<input id="lkEmail" type="email" autocomplete="username" required></label><label class="f">密碼<input id="lkPw" type="password" autocomplete="current-password" required></label><button class="btn pri" style="width:100%">登入</button></form>
          <p class="small muted">員工忘記密碼：請找機構主任產生重設碼。<br><a href="#" id="lkForgot">主任忘記密碼（使用緊急復原碼）</a></p>`,
        invite: `<form id="lkForm"><label class="f">電子郵件（主任邀請時填的那個）<input id="lkEmail" type="email" autocomplete="username" required></label><label class="f">邀請碼（XXXX-XXXX-XXXX-XXXX）<input id="lkCode" required autocomplete="off" style="text-transform:uppercase"></label>
          <label class="f">設定你的密碼（至少 10 字元，含英文與數字）<input id="lkPw" type="password" autocomplete="new-password" required></label><label class="f">再輸入一次<input id="lkPw2" type="password" autocomplete="new-password" required></label><button class="btn pri" style="width:100%">建立帳號</button></form>`,
        setup: `<p class="small">只有設定檔指定的主任信箱（${esc(CLOUD_CONFIG.adminEmail || '')}）可以建立機構，且只能做一次。</p><form id="lkForm"><label class="f">機構名稱<input id="lkOrg" value="${esc(CLOUD_CONFIG.org || '')}" required></label><label class="f">主任姓名<input id="lkName" required></label><label class="f">電子郵件<input id="lkEmail" type="email" value="${esc(CLOUD_CONFIG.adminEmail || '')}" required></label>
          <label class="f">密碼（至少 10 字元，含英文與數字）<input id="lkPw" type="password" autocomplete="new-password" required></label><label class="f">再輸入一次<input id="lkPw2" type="password" autocomplete="new-password" required></label>
          <p class="small" style="color:var(--warn)">主任密碼是整個機構資料的鑰匙之一。請另外抄寫保存「緊急復原碼」（建立後會顯示）。</p><button class="btn pri" style="width:100%">建立機構</button></form>`,
      };
      this.shell(tabs + forms[tab]);
      $$('#lock [data-lk]').forEach(b => b.onclick = () => this.loginScreen(b.dataset.lk).then(resolve));
      const fg = $('#lkForgot'); if (fg) fg.onclick = async ev => { ev.preventDefault(); const em = ($('#lkEmail').value || '').trim().toLowerCase(); if (!em) { this.msg('請先在上方填入主任信箱'); return; }
        try { await FB.sendPasswordResetEmail(this.auth, em, { url: location.origin + location.pathname }); this.msg('已寄出重設信。請點信中連結，再輸入保險櫃裡的緊急復原碼與新密碼。', true); } catch (x) { this.msg(this.errText(x)); } };
      $('#lkForm').onsubmit = async e => {

  },
  errText(e) {
    const c = e && e.code || '';
    if (/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c)) return '帳號或密碼錯誤';
    if (/too-many-requests/.test(c)) return '嘗試次數過多，帳號暫時鎖定，請稍後再試';
    if (/email-already-in-use/.test(c)) return '這個信箱已經有帳號，請直接登入';
    if (/network-request-failed/.test(c)) return '無法連線到伺服器';
    if (/permission-denied/.test(c)) return '沒有權限（帳號可能已停用，或邀請已失效）';

  async finish(dek, profile) {

  async do_login() {

  async mfaChallenge(err) {

  async do_setup() {

    $('#rcOk').onchange = e => $('#rcGo').disabled = !e.target.checked;
    await new Promise(r => $('#rcGo').onclick = r);
    DB.settings.org = org;
    this.created = { org };
    if (CLOUD_CONFIG.requireMfa) { this.profile = Object.assign({ uid: cred.user.uid }, profile); return this.mfaEnroll(); }

  },
  async do_invite() {
    const email = $('#lkEmail').value.trim().toLowerCase(), code = $('#lkCode').value.trim().toUpperCase(), pass = $('#lkPw').value;
    if (pass !== $('#lkPw2').value) throw new Error('兩次密碼不一致');

    if (CLOUD_CONFIG.requireMfa) { this.profile = Object.assign({ uid: cred.user.uid }, profile); return this.mfaEnroll(); }

  async resetScreen(oob) {

          this._dek = dek; const w = await this.wrap(dek, pass);

  /* --- 兩步驟驗證（TOTP） --- */
  async mfaEnroll() {

      <form id="mfaForm"><label class="f">6 位數驗證碼<input id="mfaNew" inputmode="numeric" maxlength="6" required autocomplete="one-time-code"></label><button class="btn pri" style="width:100%">啟用並重新登入</button></form>`);
    $('#mfaForm').onsubmit = async e => {
