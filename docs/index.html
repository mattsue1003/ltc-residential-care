        await FB.updateDoc(FB.doc(this.db, 'users', u.uid), { mfa: true }); await this.audit('啟用兩步驟驗證');
        await FB.signOut(this.auth);
        this.loginScreen('login'); this.msg('已啟用兩步驟驗證，請重新登入並輸入驗證碼', true);
      } catch (x) { this.msg(this.errText(x)); }
    };
  },

  /* --- 同步：本機 IndexedDB（加密）⇄ Firestore records（加密） --- */
  SKIP_SETTINGS: ['user', 'lastBackup', 'snapDays'],
  KV: ['settings', 'quarterly', 'accred'],
  SYNC: ['residents', 'assessments', 'daily', 'weights', 'events', 'restraints', 'plans', 'contacts', 'meetings', 'vaccines', 'notes', 'photos', 'quarterly', 'accred', 'settings'],
  entries(c) {
    if (this.KV.includes(c)) return Object.entries(DB[c]).filter(([k]) => !(c === 'settings' && this.SKIP_SETTINGS.includes(k))).map(([k, v]) => [k, { k, v }]);
    return DB[c].map(x => [x.id, x]);
  },
  snapshotKnown() { this.known.clear(); this.SYNC.forEach(c => this.entries(c).forEach(([id, v]) => this.known.set(c + '__' + id, JSON.stringify(v)))); },
  diff(colls) {
    for (const c of colls) {
      if (!this.SYNC.includes(c)) continue;
      const seen = new Set();
      for (const [id, v] of this.entries(c)) { const k = c + '__' + id, j = JSON.stringify(v); seen.add(k); if (this.known.get(k) !== j) { this.known.set(k, j); this.pending.add(k); } }
      for (const k of [...this.known.keys()]) if (k.startsWith(c + '__') && !seen.has(k)) { this.known.delete(k); this.pending.add(k); }
    }
    this.savePending(); this.pushPending();
  },
  async savePending() { await Store.rawSet('__pending', JSON.stringify([...this.pending])); },
  async pushPending() {
    if (!this.user || !this.online || this._pushing || this.blocked || !this.pending.size) { this.setStatus(); return; }
    this._pushing = true; this.setStatus();
    try {
      const keys = [...this.pending].slice(0, 400), b = FB.writeBatch(this.db);
      for (const k of keys) {
        const j = this.known.get(k), c = k.split('__')[0];
        b.set(FB.doc(this.db, 'records', k), j === undefined ? { c, del: true, d: '', u: FB.serverTimestamp(), by: this.user.uid } : { c, del: false, d: await Store.enc(j), u: FB.serverTimestamp(), by: this.user.uid });
      }
      await b.commit();
      keys.forEach(k => this.pending.delete(k)); await this.savePending();
      this._fail = 0;
    } catch (e) {
      console.error('push', e);
      if (/permission|unauthenticated/.test(e.code)) { this._pushing = false; this.blocked = true; this.setStatus(); toast('雲端拒絕寫入：帳號可能已被停用，已停止上傳（資料仍保存在本機）', 'bad'); return; }
      this._fail = (this._fail || 0) + 1;
    }
    this._pushing = false; this.setStatus();
    // 失敗時逐步拉長間隔（最多 5 分鐘），避免無限快速重試產生大量請求
    if (this.pending.size && this.online && !this.blocked) setTimeout(() => this.pushPending(), this._fail ? Math.min(300000, 2000 * 2 ** this._fail) : 300);
  },
  async startPull() {
    if (!this.user) return;
    const meta = JSON.parse((await Store.rawGet('__sync')) || '{}');
    let since = meta.last ? FB.Timestamp.fromMillis(meta.last - 60000) : FB.Timestamp.fromMillis(0);
    const q = FB.query(FB.collection(this.db, 'records'), FB.where('u', '>', since));
    this.unsub = FB.onSnapshot(q, async snap => {
      let changed = 0, maxU = meta.last || 0;
      for (const ch of snap.docChanges()) {
        const d = ch.doc.data(); if (!d.u) continue; // 自己剛寫、伺服器時間尚未回填
        maxU = Math.max(maxU, d.u.toMillis());
        const k = ch.doc.id, [c, id] = [k.slice(0, k.indexOf('__')), k.slice(k.indexOf('__') + 2)];
        if (!this.SYNC.includes(c) || this.pending.has(k)) continue;
        let val = null; if (!d.del) { try { val = JSON.parse(await Store.dec(d.d)); } catch (e) { console.warn('無法解密', k); continue; } }
        const j = val === null ? undefined : JSON.stringify(val);
        if (this.known.get(k) === j) continue;
        if (this.KV.includes(c)) { if (val === null) delete DB[c][id]; else DB[c][val.k] = val.v; }
        else { const i = DB[c].findIndex(x => x.id === id); if (val === null) { if (i >= 0) DB[c].splice(i, 1); } else if (i >= 0) DB[c][i] = val; else DB[c].push(val); }
        if (j === undefined) this.known.delete(k); else this.known.set(k, j);
        Store.dirty.add(c); changed++;
      }
      meta.last = maxU; await Store.rawSet('__sync', JSON.stringify(meta));
      if (changed) { this.pulling = true; await Store.flush(); this.pulling = false; this.softRefresh(changed); }
      this.setStatus();
    }, e => { console.error('pull', e); this.setStatus(); if (/permission/.test(e.code)) toast('雲端拒絕讀取：帳號可能已被停用', 'bad'); });
  },
  softRefresh(n) {
    const typing = document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if ($('#modal.on') || typing) { this._needRefresh = true; toast(`其他同仁更新了 ${n} 筆資料`); return; }
    refresh(); updateBrand();
  },
  async afterFlush(list) { if (this.pulling) return; this.diff(list); },

  /* --- 照片：加密後存 Cloud Storage --- */
  async uploadPhoto(id, encStr) { if (!this.user) return; try { await FB.uploadString(FB.ref(this.st, 'photos/' + id), encStr, 'raw', { contentType: 'text/plain' }); } catch (e) { console.error('upload', e); } },
  async downloadPhoto(id) { if (!this.user) return null; try { return new TextDecoder().decode(await FB.getBytes(FB.ref(this.st, 'photos/' + id))); } catch (e) { return null; } },
  async deletePhoto(id) { if (!this.user) return; try { await FB.deleteObject(FB.ref(this.st, 'photos/' + id)); } catch (e) {} },

  /* --- 稽核紀錄（雲端只可新增，不可修改刪除） --- */
  async encWith(str) { if (Store.key) return Store.enc(str); if (!this._dek) return ''; Store.key = this._dek; try { return await Store.enc(str); } finally { Store.key = null; } },
  async audit(action, rid) {
    if (!this.on || !this.auth || !this.auth.currentUser) return;
    try { await FB.setDoc(FB.doc(FB.collection(this.db, 'audit')), { uid: this.auth.currentUser.uid, at: FB.serverTimestamp(), d: await this.encWith(JSON.stringify({ action, rid: rid || '' })) }); } catch (e) { console.warn('audit', e); }
  },
  async auditList() {
    const s = await FB.getDocs(FB.query(FB.collection(this.db, 'audit'), FB.orderBy('at', 'desc'), FB.limit(200)));
    const users = await this.users(); const out = [];
    for (const d of s.docs) { const x = d.data(); let a = {}; try { a = JSON.parse(await Store.dec(x.d)); } catch (e) {} out.push({ at: x.at ? x.at.toDate() : null, user: (users.find(u => u.uid === x.uid) || {}).name || x.uid, action: a.action || '', rid: a.rid }); }
    return out;
  },

  /* --- 帳號管理（主任） --- */
  async users() { const s = await FB.getDocs(FB.collection(this.db, 'users')); return s.docs.map(d => Object.assign({ uid: d.id }, d.data())); },
  async invites() { const s = await FB.getDocs(FB.collection(this.db, 'invites')); return s.docs.map(d => Object.assign({ email: d.id }, d.data())); },
  async createInvite(email, name, role, type = 'invite') {
    email = email.trim().toLowerCase(); const code = this.newCode();
    await FB.setDoc(FB.doc(this.db, 'invites', email), { name, role, type, wrapped: await this.wrap(Store.key, code), codeHash: await this.sha256hex(code), by: this.user.uid, created: FB.serverTimestamp() });
    await this.audit(`${type === 'reset' ? '產生密碼重設碼' : '邀請員工'}：${name}（${role}）`);
    return code;
  },
  async lockOut() { if (this.unsub) this.unsub(); try { await this.audit('登出'); await FB.signOut(this.auth); } catch (e) {} location.reload(); },
};

}
ACT.tplOpen = () => {
  const D = window.__noteDraft; const t = $('#noteTitle').value; if (!t) { toast('先選擇護理問題', 'bad'); return; }

  tplState = { t, o: Object.assign({}, Object.fromEntries(T.fields.map(f => [f.key, f.def ?? (vs[f.key] !== undefined ? vs[f.key] : f.type === 'select' ? f.options[0] : '')]))) };

    <div class="grid g3" id="tplForm" style="margin-top:8px">${T.fields.map(f => `<div>${field(Object.assign({ blank: false }, f), tplState.o[f.key])}</div>`).join('')}</div>

  [5, 33, 65, 96].forEach((b, i) => mt('團體活動', b, ['懷舊歌曲團體', '園藝治療', '中秋節慶活動', '手作摺紙'][i], { participants: '住民 15 人、志工 3 人', count: 15 }));
  mt('家屬座談／教育', 140, '防災與公共安全宣導');
  mt('手部衛生稽核', 60, '第三季手部衛生稽核', { decisions: '遵從率 92%、正確率 88%' });
  mt('緊急災害應變演練', 20, '夜間火災應變演練'); mt('緊急災害應變演練', 110, '複合型災害（地震＋停電）應變演練'); mt('緊急災害應變演練', 200, '桌上模擬演練');
  mt('用電設備自主檢查', 12, '每月用電設備與延長線自主檢查'); mt('用電設備委託檢驗', 120, '委託用電設備檢驗維護業者檢驗');
  mt('水塔清洗', 150, '水塔清洗消毒'); mt('飲用水大腸桿菌群檢測', 70, '飲水機出水大腸桿菌群檢測：合格'); mt('飲水機保養', 20, '飲水機保養與濾芯更換');
  mt('危機事件半年分析', 170, '上半年意外事件與危機事件分析');
  mt('環境消毒', 45, '機構內外環境消毒'); mt('病媒防治（委外）', 100, '委外病媒防治');
  mt('教育訓練', 25, '約束替代措施與安寧緩和教育訓練'); mt('侵入性技術稽核', 150, '抽痰與換管技術稽核');
  mt('膳食滿意度調查', 160, '上半年膳食滿意度'); mt('服務滿意度調查', 300, '年度服務滿意度'); mt('感染管制計畫檢視更新', 200, '感管計畫年度更新'); mt('工作手冊審閱修訂', 250, '工作手冊年度修訂');
  // 每 2 小時翻身／如廁、照護紀錄
  const SL = ['00', '02', '04', '06', '08', '10', '12', '14', '16', '18', '20', '22'], TS = ['平躺', '左側', '右側', '半坐'];
  DB.daily.forEach(x => { const r = DB.residents.find(y => y.id === x.rid); if (!r || diffDays(x.date, T) > 3) return;
    if (/臥床/.test(r.mobility || '')) { x.turns = {}; SL.forEach((s, i) => { if (x.date === T && +s > new Date().getHours()) return; if (rnd() < 0.92) x.turns[s] = TS[i % 4]; }); }
    if (r.incontinence) { x.toilets = {}; SL.forEach(s => { if (x.date === T && +s > new Date().getHours()) return; if (rnd() < 0.8) x.toilets[s] = pick(['自解', '協助如廁', '換尿布']); }); } });
  const nt = (i, back, disc, kind, o, ho) => DB.notes.push(Object.assign({ id: uid(), rid: R[i].id, date: addDays(T, -back), time: pick(['08:30', '10:15', '14:40', '20:10']), disc, kind, handover: !!ho, by: `示範${disc.replace('人員', '')}（${disc}）`, created: nowISO() }, o));
  nt(4, 0, '護理人員', 'DAR', { D: '體溫 38.2℃、血氧 91%，咳嗽有黃痰。', A: '通知醫師，依醫囑給予退燒藥、抽痰，床頭抬高 30 度。', R: '30 分鐘後體溫 37.8℃，持續觀察。' }, true);
  nt(8, 0, '護理人員', 'DAR', { D: '步行時跌倒，左膝擦傷 2 cm。', A: '傷口清潔消毒，通知家屬，重新評估跌倒風險。', R: '無其他不適，步態穩定。' }, true);
  nt(1, 1, '職能治療師', '一般', { text: '進行進食訓練，使用易握湯匙與高邊盤，可自行進食約一半。' });
  nt(5, 1, '社工人員', '一般', { text: '住民表達思念家人，已聯繫長女本週六探視。情緒穩定。' });
  nt(10, 2, '護理人員', 'SOAP', { S: '「腳有點麻。」', O: '右足背傷口 1×1 cm，無滲液；血糖 320 mg/dL。', A: '血糖控制不佳，傷口癒合延遲風險。', P: '通知醫師調整用藥，每日換藥並監測血糖。' });
  // 前前季分析已完成
  const pq2 = prevQuarter(prevQuarter(quarterOf(T)));
  DB.quarterly[pq2] = { done: true, doneDate: addDays(T, -80), analysis: { '跌倒': { a: '夜間如廁跌倒 1 件。', b: '夜間定時如廁、離床警示。' } } };
  // 評鑑自評示範
  ['A1', 'A2', 'A7', 'A8', 'A9', 'A11', 'B1', 'B11', 'C4', 'C9', 'C15', 'D2', 'D6'].forEach(c => DB.accred[c] = { r: 'B', note: '文件已備妥（示範）' });
  DB.residents[9].portraitConsent = true; DB.residents[6].portraitConsent = true;
  COLLECTIONS.forEach(c => Store.mark(c));
}

/* ---- main.js ---- */
/* ===== 啟動 ===== */
function updateBrand() {
  $('#orgName').textContent = DB.settings.org || '長照住宿機構照護系統';
  const u = Cloud.on && Cloud.profile ? Cloud.profile : DB.settings.user; $('#userChip').textContent = u ? `${u.name}・${u.role}` : '設定使用者';
  document.title = (DB.settings.org ? DB.settings.org + '｜' : '') + '長照照護紀錄系統';
}
function askUser(first) {
  const F = [{ key: 'name', label: '您的姓名', req: true }, { key: 'role', label: '職類', type: 'select', options: ROLES, req: true }];
  openModal(first ? '歡迎使用｜請先設定使用者' : '切換使用者', `${first ? '<p class="small">每筆紀錄會標記填寫者與時間。所有資料只存在這台電腦，不會上傳。</p>' : ''}${formHTML(F, DB.settings.user || {})}
    ${first ? '<p class="small muted">想先看看系統長什麼樣子？設定好後到「設定與備份」載入示範資料。</p>' : ''}`, () => {
    const o = readForm(F); if (!o) return false; setKV('settings', 'user', o); dashRole = !!ROLE_CATS[o.role]; updateBrand(); toast(`您好，${o.name}`);
  });
}
ACT.switchUser = () => Cloud.on ? go('settings') : askUser(false);

function setupSearch() {
  const inp = $('#q'), drop = $('#qdrop');
  inp.addEventListener('input', () => {
    const v = inp.value.trim(); if (!v) { drop.style.display = 'none'; return; }
    const hits = DB.residents.filter(r => (r.name + r.bed + (r.dx || '')).includes(v)).slice(0, 10);
    const pages = NAV.flatMap(n => n[1]).filter(p => p[1].includes(v));
    drop.innerHTML = hits.map(r => `<a href="#/r/${r.id}">${esc(resLabel(r))} <span class="muted small">${esc(r.dx || '')}${inHouse(r) ? '' : '（結案）'}</span></a>`).join('') + pages.map(p => `<a href="#/${p[0]}">前往：${p[1]}</a>`).join('') || '<a class="muted">找不到</a>';
    drop.style.display = 'block';
  });
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') { const a = drop.querySelector('a[href]'); if (a) { location.hash = a.getAttribute('href'); inp.value = ''; drop.style.display = 'none'; } } });
  document.addEventListener('click', e => { if (!e.target.closest('.search')) drop.style.display = 'none'; else if (e.target.closest('#qdrop a')) { inp.value = ''; drop.style.display = 'none'; } });
  document.addEventListener('keydown', e => { if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); inp.focus(); } });
}

async function boot() {
  try { const t = localStorage.getItem('ltc-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  await Store.open();
  if (Cloud.on) return bootCloud();
  const meta = await Store.meta();
  if (meta && meta.enc) {
    document.body.insertAdjacentHTML('beforeend', `<div class="lock" id="lock"><form class="box" id="lockForm"><h2 style="margin-top:0">🔒 系統已上鎖</h2><p class="small muted">請輸入密碼解鎖本機資料。</p>
      <label class="f">密碼<input type="password" id="lockPw" autocomplete="current-password" autofocus></label><button class="btn pri" style="width:100%">解鎖</button><p id="lockMsg" class="small" style="color:var(--bad)"></p></form></div>`);
    await new Promise(res => {
      $('#lockForm').addEventListener('submit', async e => {
        e.preventDefault(); $('#lockMsg').textContent = '解鎖中…';
        if (await Store.unlock($('#lockPw').value)) { $('#lock').remove(); res(); } else { $('#lockMsg').textContent = '密碼錯誤'; $('#lockPw').select(); }
      });
    });
  }
  await Store.loadAll();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  await Folder.init(); cleanupOrphans();
  updateBrand(); setupSearch(); applyFontScale(); dashRole = !!ROLE_CATS[myRole()];
  window.addEventListener('hashchange', render);
  window.addEventListener('beforeunload', () => { if (Store.dirty.size) Store.flush(); });
  render();
  const wantTrial = /[?&]trial\b/.test(location.search) || !DB.residents.length;
  if (wantTrial && await trialAvailable()) { history.replaceState(null, '', location.pathname + location.hash); openTrialLoader(true); }
  else if (!DB.settings.user) askUser(true);
  // 自動逾時鎖定（有密碼時，閒置 15 分鐘）
  let idle; const reset = () => { clearTimeout(idle); if (Store.key) idle = setTimeout(async () => { await Store.flush(); location.reload(); }, 15 * 60 * 1000); };
  ['click', 'keydown'].forEach(ev => document.addEventListener(ev, reset)); reset();
}
async function bootCloud() {
  $('header.top').insertAdjacentHTML('beforeend', '<span id="cloudStatus"></span>');
  await Cloud.boot();
  await Store.loadAll();
  if (Cloud.created) { DB.settings.org = Cloud.created.org; }
  Cloud.snapshotKnown();
  if (Cloud.created) { Cloud.known.clear(); }
  try { JSON.parse((await Store.rawGet('__pending')) || '[]').forEach(k => Cloud.pending.add(k)); } catch (e) {}
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  cleanupOrphans(); updateBrand(); setupSearch(); applyFontScale(); dashRole = !!ROLE_CATS[myRole()];
  window.addEventListener('hashchange', render);
  window.addEventListener('beforeunload', e => { if (Store.dirty.size) Store.flush(); if (Cloud.pending.size) { e.preventDefault(); e.returnValue = ''; } });
  render(); Cloud.setStatus();
  if (Cloud.created) Store.mark('settings'), COLLECTIONS.forEach(c => Store.mark(c));
  await Cloud.startPull(); Cloud.pushPending();
  let idle; const reset = () => { clearTimeout(idle); idle = setTimeout(async () => { await Store.flush(); Cloud.lockOut(); }, 15 * 60 * 1000); };
  ['click', 'keydown', 'touchstart'].forEach(ev => document.addEventListener(ev, reset)); reset();
  document.addEventListener('focusout', () => { if (Cloud._needRefresh && !$('#modal.on')) { Cloud._needRefresh = false; setTimeout(refresh, 50); } });
}
boot();
</script>
